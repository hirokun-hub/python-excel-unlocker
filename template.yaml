AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Excel Password Remover API
  This project provides an API to unlock password-protected Excel files.

# Conditions for environment-specific configurations
Conditions:
  IsProduction: !Equals [!Ref Environment, "production"]
  IsStaging: !Equals [!Ref Environment, "staging"]
  IsDevelopment: !Equals [!Ref Environment, "development"]
  ShouldCreateOIDCProvider: !Equals [!Ref CreateOIDCProvider, "true"]

# Parameters for configuration
Parameters:
  Environment:
    Type: String
    Default: "development"
    AllowedValues:
      - development
      - staging
      - production
    Description: "Deployment environment"
  
  AllowedUsers:
    Type: String
    Default: "hironomac2025@gmail.com"
    Description: "Comma-separated list of allowed user email addresses"
  
  AllowedOrigin:
    Type: String
    Default: "https://localhost:3000"
    Description: "Single allowed CORS origin for security hardening"
    AllowedValues:
      - "https://localhost:3000"  # development
      - "https://excel-unlocker-staging.vercel.app"  # staging
      - "https://excel-unlocker.vercel.app"  # production
  
  EnableBotProtection:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable additional bot protection (reCAPTCHA/Turnstile)"
  
  GoogleClientId:
    Type: String
    Default: "dummy-client-id"
    Description: "Google OAuth Client ID for JWT authentication"
    NoEcho: true
  
  CreateOIDCProvider:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Create GitHub OIDC Provider (set to true only if not exists)"

# Global parameters can be defined here
Globals:
  Function:
    Timeout: 30 # Default timeout for Lambda functions in seconds
    MemorySize: 256 # Default memory allocation (パフォーマンス最適化)
    Runtime: python3.9
    Architectures:
      - x86_64
    Environment:
      Variables:
        # パフォーマンス最適化：Lambda環境変数
        PYTHONPATH: /var/runtime
        AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: !Sub "'${AllowedOrigin}'"
      AllowCredentials: "'true'"
    # レート制限設定
    MethodSettings:
      - ResourcePath: "/*"
        HttpMethod: "*"
        # スロットリング設定（DDoS対策）
        ThrottlingBurstLimit: !If [IsProduction, 100, 200]  # バーストリミット
        ThrottlingRateLimit: !If [IsProduction, 50, 100]    # 継続レート制限（req/sec）
        # ログ設定
        LoggingLevel: !If [IsProduction, "ERROR", "INFO"]
        DataTraceEnabled: !If [IsProduction, false, true]
        MetricsEnabled: true

# AWS Resources definition
Resources:
  # S3 Bucket for storing Excel files
  ExcelBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "excel-unlocker-bucket-${Environment}-${AWS::AccountId}-${AWS::Region}"
      # セキュリティ強化：パブリックアクセスブロック
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # セキュリティ強化：暗号化設定
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      # セキュリティ強化：バージョニング無効化（一時ファイルのため）
      VersioningConfiguration:
        Status: Suspended
      # セキュリティ強化：ライフサイクル設定（一時ファイルの自動削除）
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: DeleteTemporaryFiles
            Status: Enabled
            ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
      # セキュリティ強化：CORS設定の厳格化
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "Content-Type"
              - "Content-Length"
              - "Authorization"
              - "X-Amz-Date"
              - "X-Amz-Security-Token"
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins: 
              - !Ref AllowedOrigin
            MaxAge: 3600
            ExposedHeaders:
              - "ETag"

  # セキュリティ強化：S3バケットポリシー
  ExcelBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ExcelBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Lambda関数からのアクセスのみ許可
          - Sid: AllowLambdaAccess
            Effect: Allow
            Principal:
              AWS: 
                - !GetAtt GetUploadUrlFunctionRole.Arn
                - !GetAtt UnlockFunctionRole.Arn
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${ExcelBucket}/*"
          # 署名付きURLによるアクセス許可
          - Sid: AllowPresignedUrlAccess
            Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "${ExcelBucket}/*"
            Condition:
              StringEquals:
                "s3:signatureAge": "3600"  # 1時間以内の署名のみ
          # パブリックアクセスの明示的拒否
          - Sid: DenyPublicAccess
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: 
              - !Sub "${ExcelBucket}"
              - !Sub "${ExcelBucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # セキュリティ強化：GetUploadUrlFunction用IAMロール
  GetUploadUrlFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub "${ExcelBucket}/*"

  # セキュリティ強化：UnlockFunction用IAMロール
  UnlockFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${ExcelBucket}/*"

  # Lambda Function for generating presigned URLs
  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "excel-get-upload-url-function-${Environment}"
      CodeUri: backend/src/
      Handler: get_upload_url.lambda_handler
      Timeout: 30
      MemorySize: 256  # パフォーマンス最適化：メモリ増量でCPU性能向上
      # セキュリティ強化：明示的IAMロール割り当て
      Role: !GetAtt GetUploadUrlFunctionRole.Arn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref ExcelBucket
          LOG_LEVEL: !If [IsProduction, "WARN", "INFO"]
          ALLOWED_USERS: !Ref AllowedUsers
          ENVIRONMENT: !Ref Environment
          # JWT認証用のGoogle Client ID
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          # CORS設定の厳格化：環境別許可オリジン（単一値）
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          # Bot保護設定
          ENABLE_BOT_PROTECTION: !Ref EnableBotProtection
          # パフォーマンス最適化：環境変数
          AWS_LAMBDA_LOG_LEVEL: !If [IsProduction, "WARN", "INFO"]
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /presigned-urls
            Method: post

  # Lambda Function for unlocking Excel files
  UnlockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "excel-unlock-function-${Environment}"
      CodeUri: backend/src/
      Handler: unlock.lambda_handler
      Timeout: 900  # 15分（Excel処理に時間がかかる場合があるため）
      MemorySize: 1024  # パフォーマンス最適化：並列処理とExcel処理のためメモリ増量
      # セキュリティ強化：明示的IAMロール割り当て
      Role: !GetAtt UnlockFunctionRole.Arn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref ExcelBucket
          LOG_LEVEL: !If [IsProduction, "WARN", "INFO"]
          ALLOWED_USERS: !Ref AllowedUsers
          ENVIRONMENT: !Ref Environment
          # JWT認証用のGoogle Client ID
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          # CORS設定の厳格化：環境別許可オリジン（単一値）
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          # Bot保護設定
          ENABLE_BOT_PROTECTION: !Ref EnableBotProtection
          # パフォーマンス最適化：環境変数
          AWS_LAMBDA_LOG_LEVEL: !If [IsProduction, "WARN", "INFO"]
          PYTHONUNBUFFERED: 1  # Python出力バッファリング無効化
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /unlock
            Method: post

  # CloudWatch Alarms for monitoring
  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ExcelUnlocker-HighErrorRate-${Environment}"
      AlarmDescription: "High error rate detected in Excel Unlocker API"
      MetricName: "Errors"
      Namespace: "AWS/Lambda"
      Statistic: "Sum"
      Period: 300  # 5分間
      EvaluationPeriods: 2
      Threshold: 5  # 5分間で5回以上のエラー
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: "FunctionName"
          Value: !Ref UnlockFunction
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  HighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ExcelUnlocker-HighLatency-${Environment}"
      AlarmDescription: "High latency detected in Excel Unlocker API"
      MetricName: "Duration"
      Namespace: "AWS/Lambda"
      Statistic: "Average"
      Period: 300  # 5分間
      EvaluationPeriods: 2
      Threshold: 10000  # 10秒
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: "FunctionName"
          Value: !Ref UnlockFunction
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  # SNS Topic for alerts
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "ExcelUnlocker-Alerts-${Environment}"
      DisplayName: !Sub "Excel Unlocker Alerts (${Environment})"

  # SNS Subscription for email alerts
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: "email"
      TopicArn: !Ref AlertTopic
      Endpoint: "hironomac2025@gmail.com"  # 管理者メールアドレス

  # GitHub OIDC化：IAM OIDCプロバイダー（条件付き作成）
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Name
          Value: !Sub "GitHubOIDC-${Environment}"
        - Key: Environment
          Value: !Ref Environment

  # GitHub OIDC化：GitHub Actions用IAMロール
  GitHubActionsRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub "GitHubActions-ExcelUnlocker-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If 
                - ShouldCreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              StringLike:
                "token.actions.githubusercontent.com:sub": "repo:hirokun-hub/python-excel-unlocker:*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess  # SAMデプロイに必要な権限
      Policies:
        - PolicyName: CloudFormationFullAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource: "*"
        - PolicyName: IAMRoleManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                Resource: 
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/excel-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/GitHubActions-*"
              - Effect: Allow
                Action:
                  - iam:CreateOpenIDConnectProvider
                  - iam:DeleteOpenIDConnectProvider
                  - iam:GetOpenIDConnectProvider
                  - iam:TagOpenIDConnectProvider
                  - iam:UntagOpenIDConnectProvider
                  - iam:UpdateOpenIDConnectProviderThumbprint
                Resource: 
                  - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
      Tags:
        - Key: Name
          Value: !Sub "GitHubActions-ExcelUnlocker-${Environment}"
        - Key: Environment
          Value: !Ref Environment

  # WAFv2 Web ACL for API Gateway protection
  ApiGatewayWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "ExcelUnlocker-WebACL-${Environment}"
      Description: "WAF Web ACL for Excel Unlocker API protection"
      Scope: REGIONAL  # API Gateway用
      DefaultAction:
        Allow: {}
      Rules:
        # レートベースルール（DDoS対策）
        - Name: RateLimitRule
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: !If [IsProduction, 1000, 2000]  # 5分間のリクエスト制限
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "ExcelUnlocker-RateLimit-${Environment}"
        
        # 地理的制限（日本のみ許可）
        - Name: GeoBlockRule
          Priority: 2
          Statement:
            GeoMatchStatement:
              CountryCodes:
                - JP  # 日本のみ許可
          Action:
            Allow: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "ExcelUnlocker-GeoBlock-${Environment}"
        
        # 既知の悪意のあるIPアドレスブロック（AWS Managed Rule）
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "ExcelUnlocker-KnownBadInputs-${Environment}"
        
        # Core Rule Set（一般的な攻撃パターン）
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 4
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # 除外ルール（必要に応じて調整）
              ExcludedRules:
                - Name: SizeRestrictions_BODY  # ファイルアップロード用に除外
                - Name: GenericRFI_BODY       # 正当なリクエストが誤検知される場合
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "ExcelUnlocker-CommonRules-${Environment}"
        
        # Bot制御（AWS Managed Rule）
        - Name: AWSManagedRulesBotControlRuleSet
          Priority: 5
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesBotControlRuleSet
              # Bot制御の設定
              ManagedRuleGroupConfigs:
                - AWSManagedRulesBotControlRuleSet:
                    InspectionLevel: COMMON  # COMMON | TARGETED
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "ExcelUnlocker-BotControl-${Environment}"
        
        # カスタムIPブロックリスト（必要に応じて）
        - Name: CustomIPBlockRule
          Priority: 6
          Statement:
            IPSetReferenceStatement:
              Arn: !GetAtt BlockedIPSet.Arn
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "ExcelUnlocker-CustomIPBlock-${Environment}"
      
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "ExcelUnlocker-WebACL-${Environment}"
      
      Tags:
        - Key: Name
          Value: !Sub "ExcelUnlocker-WebACL-${Environment}"
        - Key: Environment
          Value: !Ref Environment

  # カスタムIPセット（ブロック対象IP）
  BlockedIPSet:
    Type: AWS::WAFv2::IPSet
    Properties:
      Name: !Sub "ExcelUnlocker-BlockedIPs-${Environment}"
      Description: "Blocked IP addresses for Excel Unlocker API"
      Scope: REGIONAL
      IPAddressVersion: IPV4
      Addresses: []  # 初期は空、必要に応じて追加
      Tags:
        - Key: Name
          Value: !Sub "ExcelUnlocker-BlockedIPs-${Environment}"
        - Key: Environment
          Value: !Ref Environment

  # 許可IPセット（ホワイトリスト、必要に応じて）
  AllowedIPSet:
    Type: AWS::WAFv2::IPSet
    Properties:
      Name: !Sub "ExcelUnlocker-AllowedIPs-${Environment}"
      Description: "Allowed IP addresses for Excel Unlocker API"
      Scope: REGIONAL
      IPAddressVersion: IPV4
      Addresses: []  # 必要に応じて社内IPアドレスを追加
      Tags:
        - Key: Name
          Value: !Sub "ExcelUnlocker-AllowedIPs-${Environment}"
        - Key: Environment
          Value: !Ref Environment

  # WAF Web ACLをAPI Gatewayに関連付け
  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${ServerlessRestApi}/stages/Prod"
      WebACLArn: !GetAtt ApiGatewayWebACL.Arn

  # WAF用CloudWatchアラーム（高レート制限検知）
  HighRateLimitAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ExcelUnlocker-HighRateLimit-${Environment}"
      AlarmDescription: "High rate limit blocks detected in WAF"
      MetricName: !Sub "ExcelUnlocker-RateLimit-${Environment}"
      Namespace: "AWS/WAFV2"
      Statistic: "Sum"
      Period: 300  # 5分間
      EvaluationPeriods: 2
      Threshold: 50  # 5分間で50回以上のブロック
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: "WebACL"
          Value: !Sub "ExcelUnlocker-WebACL-${Environment}"
        - Name: "Rule"
          Value: "RateLimitRule"
        - Name: "Region"
          Value: !Ref AWS::Region
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  # WAF用CloudWatchアラーム（Bot攻撃検知）
  BotAttackAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ExcelUnlocker-BotAttack-${Environment}"
      AlarmDescription: "Bot attacks detected in WAF"
      MetricName: !Sub "ExcelUnlocker-BotControl-${Environment}"
      Namespace: "AWS/WAFV2"
      Statistic: "Sum"
      Period: 300  # 5分間
      EvaluationPeriods: 1
      Threshold: 10  # 5分間で10回以上のBot検知
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: "WebACL"
          Value: !Sub "ExcelUnlocker-WebACL-${Environment}"
        - Name: "Rule"
          Value: "AWSManagedRulesBotControlRuleSet"
        - Name: "Region"
          Value: !Ref AWS::Region
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  # CloudWatch Dashboard
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "ExcelUnlocker-Dashboard-${Environment}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${UnlockFunction}" ],
                  [ ".", "Errors", ".", "." ],
                  [ ".", "Duration", ".", "." ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Lambda Metrics - Unlock Function"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${GetUploadUrlFunction}" ],
                  [ ".", "Errors", ".", "." ],
                  [ ".", "Duration", ".", "." ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Lambda Metrics - Get Upload URL Function"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 24,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/S3", "BucketSizeBytes", "BucketName", "${ExcelBucket}", "StorageType", "StandardStorage" ]
                ],
                "period": 86400,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "S3 Bucket Size"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/WAFV2", "AllowedRequests", "WebACL", "ExcelUnlocker-WebACL-${Environment}", "Region", "${AWS::Region}" ],
                  [ ".", "BlockedRequests", ".", ".", ".", "." ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "WAF Requests"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/WAFV2", "ExcelUnlocker-RateLimit-${Environment}", "WebACL", "ExcelUnlocker-WebACL-${Environment}", "Rule", "RateLimitRule", "Region", "${AWS::Region}" ],
                  [ ".", "ExcelUnlocker-BotControl-${Environment}", ".", ".", "Rule", "AWSManagedRulesBotControlRuleSet", ".", "." ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "WAF Security Events"
              }
            }
          ]
        }

# Outputs to easily access created resources
Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL for the Excel Unlocker API"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  UnlockApiUrl:
    Description: "API Gateway endpoint URL for the Excel Unlock function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/unlock"
  PresignedUrlApiUrl:
    Description: "API Gateway endpoint URL for the Presigned URL function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/presigned-urls"
  BucketName:
    Description: "Name of the S3 bucket for storing Excel files"
    Value: !Ref ExcelBucket
  
  Environment:
    Description: "Deployment environment"
    Value: !Ref Environment
  
  DashboardUrl:
    Description: "CloudWatch Dashboard URL"
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${MonitoringDashboard}"
  
  AlertTopicArn:
    Description: "SNS Topic ARN for alerts"
    Value: !Ref AlertTopic
  
  # GitHub OIDC化：GitHub Actions用の情報
  GitHubActionsRoleArn:
    Description: "GitHub Actions IAM Role ARN for OIDC authentication"
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GitHubActionsRoleArn"
  
  GitHubOIDCProviderArn:
    Description: "GitHub OIDC Provider ARN"
    Value: !If 
      - ShouldCreateOIDCProvider
      - !Ref GitHubOIDCProvider
      - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
    Export:
      Name: !Sub "${AWS::StackName}-GitHubOIDCProviderArn"
  
  # WAF関連の出力
  WebACLArn:
    Description: "WAF Web ACL ARN for API protection"
    Value: !GetAtt ApiGatewayWebACL.Arn
    Export:
      Name: !Sub "${AWS::StackName}-WebACLArn"
  
  WebACLId:
    Description: "WAF Web ACL ID"
    Value: !Ref ApiGatewayWebACL
    Export:
      Name: !Sub "${AWS::StackName}-WebACLId"
  
  BlockedIPSetArn:
    Description: "Blocked IP Set ARN for manual IP blocking"
    Value: !GetAtt BlockedIPSet.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BlockedIPSetArn"
  
  AllowedIPSetArn:
    Description: "Allowed IP Set ARN for IP whitelisting"
    Value: !GetAtt AllowedIPSet.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AllowedIPSetArn"
