AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Excel Password Remover API
  This project provides an API to unlock password-protected Excel files.

# Conditions for environment-specific configurations
Conditions:
  IsProduction: !Equals [!Ref Environment, "production"]
  IsStaging: !Equals [!Ref Environment, "staging"]
  IsDevelopment: !Equals [!Ref Environment, "development"]

# Parameters for configuration
Parameters:
  Environment:
    Type: String
    Default: "development"
    AllowedValues:
      - development
      - staging
      - production
    Description: "Deployment environment"
  
  AllowedUsers:
    Type: String
    Default: "hironomac2025@gmail.com"
    Description: "Comma-separated list of allowed user email addresses"
  
  AllowedOrigin:
    Type: String
    Default: "https://localhost:3000"
    Description: "Single allowed CORS origin for security hardening"
    AllowedValues:
      - "https://localhost:3000"  # development
      - "https://excel-unlocker-staging.vercel.app"  # staging
      - "https://excel-unlocker.vercel.app"  # production

# Global parameters can be defined here
Globals:
  Function:
    Timeout: 30 # Default timeout for Lambda functions in seconds
    MemorySize: 256 # Default memory allocation (パフォーマンス最適化)
    Runtime: python3.9
    Architectures:
      - x86_64
    Environment:
      Variables:
        # パフォーマンス最適化：Lambda環境変数
        PYTHONPATH: /var/runtime
        AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: !Sub "'${AllowedOrigin}'"

# AWS Resources definition
Resources:
  # S3 Bucket for storing Excel files
  ExcelBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "excel-unlocker-bucket-${Environment}-${AWS::AccountId}-${AWS::Region}"
      # セキュリティ強化：パブリックアクセスブロック
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # セキュリティ強化：暗号化設定
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      # セキュリティ強化：バージョニング無効化（一時ファイルのため）
      VersioningConfiguration:
        Status: Suspended
      # セキュリティ強化：ライフサイクル設定（一時ファイルの自動削除）
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: DeleteTemporaryFiles
            Status: Enabled
            ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
      # セキュリティ強化：CORS設定の厳格化
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "Content-Type"
              - "Content-Length"
              - "Authorization"
              - "X-Amz-Date"
              - "X-Amz-Security-Token"
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins: 
              - !Ref AllowedOrigin
            MaxAge: 3600
            ExposedHeaders:
              - "ETag"

  # セキュリティ強化：S3バケットポリシー
  ExcelBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ExcelBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Lambda関数からのアクセスのみ許可
          - Sid: AllowLambdaAccess
            Effect: Allow
            Principal:
              AWS: 
                - !GetAtt GetUploadUrlFunctionRole.Arn
                - !GetAtt UnlockFunctionRole.Arn
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${ExcelBucket}/*"
          # 署名付きURLによるアクセス許可
          - Sid: AllowPresignedUrlAccess
            Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "${ExcelBucket}/*"
            Condition:
              StringEquals:
                "s3:signatureAge": "3600"  # 1時間以内の署名のみ
          # パブリックアクセスの明示的拒否
          - Sid: DenyPublicAccess
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: 
              - !Sub "${ExcelBucket}"
              - !Sub "${ExcelBucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # セキュリティ強化：GetUploadUrlFunction用IAMロール
  GetUploadUrlFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub "${ExcelBucket}/*"

  # セキュリティ強化：UnlockFunction用IAMロール
  UnlockFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${ExcelBucket}/*"

  # Lambda Function for generating presigned URLs
  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "excel-get-upload-url-function-${Environment}"
      CodeUri: backend/src/
      Handler: get_upload_url.lambda_handler
      Timeout: 30
      MemorySize: 256  # パフォーマンス最適化：メモリ増量でCPU性能向上
      # セキュリティ強化：明示的IAMロール割り当て
      Role: !GetAtt GetUploadUrlFunctionRole.Arn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref ExcelBucket
          LOG_LEVEL: !If [IsProduction, "WARN", "INFO"]
          ALLOWED_USERS: !Ref AllowedUsers
          ENVIRONMENT: !Ref Environment
          # JWT認証用のGoogle Client ID
          GOOGLE_CLIENT_ID: "{{resolve:ssm:/excel-unlocker/google-client-id:1}}"
          # CORS設定の厳格化：環境別許可オリジン（単一値）
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          # パフォーマンス最適化：環境変数
          AWS_LAMBDA_LOG_LEVEL: !If [IsProduction, "WARN", "INFO"]
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /presigned-urls
            Method: post

  # Lambda Function for unlocking Excel files
  UnlockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "excel-unlock-function-${Environment}"
      CodeUri: backend/src/
      Handler: unlock.lambda_handler
      Timeout: 900  # 15分（Excel処理に時間がかかる場合があるため）
      MemorySize: 1024  # パフォーマンス最適化：並列処理とExcel処理のためメモリ増量
      # セキュリティ強化：明示的IAMロール割り当て
      Role: !GetAtt UnlockFunctionRole.Arn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref ExcelBucket
          LOG_LEVEL: !If [IsProduction, "WARN", "INFO"]
          ALLOWED_USERS: !Ref AllowedUsers
          ENVIRONMENT: !Ref Environment
          # JWT認証用のGoogle Client ID
          GOOGLE_CLIENT_ID: "{{resolve:ssm:/excel-unlocker/google-client-id:1}}"
          # CORS設定の厳格化：環境別許可オリジン（単一値）
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          # パフォーマンス最適化：環境変数
          AWS_LAMBDA_LOG_LEVEL: !If [IsProduction, "WARN", "INFO"]
          PYTHONUNBUFFERED: 1  # Python出力バッファリング無効化
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /unlock
            Method: post

  # CloudWatch Alarms for monitoring
  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ExcelUnlocker-HighErrorRate-${Environment}"
      AlarmDescription: "High error rate detected in Excel Unlocker API"
      MetricName: "Errors"
      Namespace: "AWS/Lambda"
      Statistic: "Sum"
      Period: 300  # 5分間
      EvaluationPeriods: 2
      Threshold: 5  # 5分間で5回以上のエラー
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: "FunctionName"
          Value: !Ref UnlockFunction
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  HighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ExcelUnlocker-HighLatency-${Environment}"
      AlarmDescription: "High latency detected in Excel Unlocker API"
      MetricName: "Duration"
      Namespace: "AWS/Lambda"
      Statistic: "Average"
      Period: 300  # 5分間
      EvaluationPeriods: 2
      Threshold: 10000  # 10秒
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: "FunctionName"
          Value: !Ref UnlockFunction
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  # SNS Topic for alerts
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "ExcelUnlocker-Alerts-${Environment}"
      DisplayName: !Sub "Excel Unlocker Alerts (${Environment})"

  # SNS Subscription for email alerts
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: "email"
      TopicArn: !Ref AlertTopic
      Endpoint: "hironomac2025@gmail.com"  # 管理者メールアドレス

  # GitHub OIDC化：IAM OIDCプロバイダー
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCIdentityProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Name
          Value: !Sub "GitHubOIDC-${Environment}"
        - Key: Environment
          Value: !Ref Environment

  # GitHub OIDC化：GitHub Actions用IAMロール
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "GitHubActions-ExcelUnlocker-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              StringLike:
                "token.actions.githubusercontent.com:sub": "repo:hirokun-hub/python-excel-unlocker:*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess  # SAMデプロイに必要な権限
      Policies:
        - PolicyName: CloudFormationFullAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource: "*"
        - PolicyName: IAMRoleManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                Resource: 
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/excel-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/GitHubActions-*"
      Tags:
        - Key: Name
          Value: !Sub "GitHubActions-ExcelUnlocker-${Environment}"
        - Key: Environment
          Value: !Ref Environment

  # CloudWatch Dashboard
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "ExcelUnlocker-Dashboard-${Environment}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${UnlockFunction}" ],
                  [ ".", "Errors", ".", "." ],
                  [ ".", "Duration", ".", "." ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Lambda Metrics - Unlock Function"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${GetUploadUrlFunction}" ],
                  [ ".", "Errors", ".", "." ],
                  [ ".", "Duration", ".", "." ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Lambda Metrics - Get Upload URL Function"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 24,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/S3", "BucketSizeBytes", "BucketName", "${ExcelBucket}", "StorageType", "StandardStorage" ]
                ],
                "period": 86400,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "S3 Bucket Size"
              }
            }
          ]
        }

# Outputs to easily access created resources
Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL for the Excel Unlocker API"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  UnlockApiUrl:
    Description: "API Gateway endpoint URL for the Excel Unlock function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/unlock"
  PresignedUrlApiUrl:
    Description: "API Gateway endpoint URL for the Presigned URL function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/presigned-urls"
  BucketName:
    Description: "Name of the S3 bucket for storing Excel files"
    Value: !Ref ExcelBucket
  
  Environment:
    Description: "Deployment environment"
    Value: !Ref Environment
  
  DashboardUrl:
    Description: "CloudWatch Dashboard URL"
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${MonitoringDashboard}"
  
  AlertTopicArn:
    Description: "SNS Topic ARN for alerts"
    Value: !Ref AlertTopic
  
  # GitHub OIDC化：GitHub Actions用の情報
  GitHubActionsRoleArn:
    Description: "GitHub Actions IAM Role ARN for OIDC authentication"
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GitHubActionsRoleArn"
  
  GitHubOIDCProviderArn:
    Description: "GitHub OIDC Provider ARN"
    Value: !Ref GitHubOIDCProvider
    Export:
      Name: !Sub "${AWS::StackName}-GitHubOIDCProviderArn"
