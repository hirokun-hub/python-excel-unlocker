AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Excel Password Remover API
  This project provides an API to unlock password-protected Excel files.

# Global parameters can be defined here
Globals:
  Function:
    Timeout: 30 # Timeout for Lambda functions in seconds
    MemorySize: 128 # Memory allocation for Lambda functions in MB
    Runtime: python3.9
    Architectures:
      - x86_64

# AWS Resources definition
Resources:
  # S3 Bucket for storing Excel files
  ExcelBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "excel-unlocker-bucket-${AWS::AccountId}-${AWS::Region}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - "*" # In production, you should restrict this to your frontend's domain
            MaxAge: 3600

  # Lambda Function for unlocking Excel files
  UnlockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: excel-unlocker-function
      CodeUri: backend/src/
      Handler: main.lambda_handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ExcelBucket
        - S3WritePolicy:
            BucketName: !Ref ExcelBucket
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref ExcelBucket
      Events:
        # This event creates an API Gateway endpoint that triggers the Lambda function
        ApiEvent:
          Type: Api
          Properties:
            Path: /unlock
            Method: post

# Outputs to easily access created resources
Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL for the Excel Unlocker function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/unlock"
  BucketName:
    Description: "Name of the S3 bucket for storing Excel files"
    Value: !Ref ExcelBucket
