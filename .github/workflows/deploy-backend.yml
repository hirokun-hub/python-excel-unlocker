name: Deploy Backend to AWS

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'template.yaml'
      - 'samconfig.toml'
      - '.github/workflows/deploy-backend.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'template.yaml'
      - 'samconfig.toml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ環境'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      skip_deploy:
        description: 'デプロイ処理をスキップしテストのみ実行'
        required: false
        default: false
        type: boolean

jobs:
  backend:
    name: Backend validation and deployment
    uses: ./.github/workflows/deploy-aws.yml
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'staging') || (github.ref == 'refs/heads/develop' && 'development') || (github.base_ref == 'main' && 'staging') || 'development' }}
      skip_deploy: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_deploy == 'true') }}
    secrets: inherit
