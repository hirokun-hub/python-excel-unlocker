name: 🚀 Deployment Suite

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: string
      python-version:
        description: 'Python version to use'
        required: false
        default: '3.11'
        type: string

jobs:
  deploy-backend:
    name: 🔧 Deploy Backend (AWS Lambda)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}

      - name: 🔧 Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🏗️ Build SAM application
        run: sam build --use-container

      - name: 🚀 Deploy to AWS
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name secure-excel-unlock-${{ inputs.environment }} \
            --parameter-overrides \
              Environment=${{ inputs.environment }} \
              S3BucketName=${{ secrets.S3_BUCKET_NAME }} \
            --capabilities CAPABILITY_IAM

      - name: 📊 Get deployment outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name secure-excel-unlock-${{ inputs.environment }} \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: 🧪 Run smoke tests
        run: |
          # API Gateway エンドポイントの疎通確認
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name secure-excel-unlock-${{ inputs.environment }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayUrl`].OutputValue' \
            --output text)
          
          echo "Testing API endpoint: $API_URL"
          curl -f "$API_URL/health" || exit 1

  deploy-frontend:
    name: 🎨 Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [deploy-backend]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📚 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build application
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'

      - name: 🧪 Run frontend smoke tests
        run: |
          # フロントエンドの疎通確認
          FRONTEND_URL="${{ secrets.NEXTAUTH_URL }}"
          echo "Testing frontend: $FRONTEND_URL"
          curl -f "$FRONTEND_URL" || exit 1

  post-deploy-verification:
    name: ✅ Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🧪 Run integration smoke tests
        run: |
          # 統合テストの実行
          echo "Running post-deployment verification..."
          
          # API とフロントエンドの連携確認
          API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
          FRONTEND_URL="${{ secrets.NEXTAUTH_URL }}"
          
          echo "✅ Backend API: $API_URL"
          echo "✅ Frontend App: $FRONTEND_URL"
          
          # 基本的なヘルスチェック
          curl -f "$API_URL/health" && echo "✅ Backend health check passed"
          curl -f "$FRONTEND_URL" && echo "✅ Frontend health check passed"

      - name: 📊 Update deployment status
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "Environment: ${{ inputs.environment }}"
          echo "Timestamp: $(date -u)"