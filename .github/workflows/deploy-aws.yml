name: "[Reusable] Backend - Deploy to AWS"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ環境'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      skip_deploy:
        description: 'デプロイ処理をスキップしテストのみ実行'
        required: false
        default: false
        type: boolean
      run_tests:
        description: 'バックエンドテストを実行'
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      environment:
        description: 'デプロイ環境'
        required: true
        type: string
      skip_deploy:
        description: 'デプロイ処理をスキップしテストのみ実行'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'バックエンドテストを実行'
        required: false
        type: boolean
        default: true
    secrets:
      AWS_GITHUB_ACTIONS_ROLE_ARN:
        description: 'Assumable IAM role ARN for OIDC-based deployments'
        required: false
      AWS_ACCESS_KEY_ID:
        description: 'Access key ID for fallback AWS authentication'
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: 'Secret access key for fallback AWS authentication'
        required: false
      ALLOWED_USERS:
        description: 'Comma-separated list of allowed users for production access'
        required: false
      VERCEL_TOKEN:
        description: 'Vercel access token used for environment updates'
        required: false
    outputs:
      api_url:
        description: 'API Gateway URL'
        value: ${{ jobs.deploy-aws.outputs.api_url }}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy-aws:
    name: Validate and Deploy Backend
    runs-on: ubuntu-latest
    env:
      AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
    outputs:
      api_url: ${{ steps.finalize.outputs.api_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine execution parameters
        id: params
        run: |
          ENV="${{ inputs.environment }}"
          if [ -z "$ENV" ]; then
            ENV="${{ github.event.inputs.environment }}"
          fi
          if [ -z "$ENV" ]; then
            ENV="development"
          fi

          SKIP="${{ inputs.skip_deploy }}"
          if [ -z "$SKIP" ]; then
            SKIP="${{ github.event.inputs.skip_deploy }}"
          fi
          if [ "$SKIP" = "true" ] || [ "$SKIP" = "1" ]; then
            SKIP_DEPLOY="true"
          else
            SKIP_DEPLOY="false"
          fi

          RUN_TESTS="${{ inputs.run_tests }}"
          if [ -z "$RUN_TESTS" ]; then
            RUN_TESTS="${{ github.event.inputs.run_tests }}"
          fi
          if [ "$RUN_TESTS" = "false" ] || [ "$RUN_TESTS" = "0" ]; then
            RUN_TESTS="false"
          else
            RUN_TESTS="true"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "skip_deploy=$SKIP_DEPLOY" >> $GITHUB_OUTPUT
          echo "run_tests=$RUN_TESTS" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ format('{0}-pip-{1}', runner.os, hashFiles('backend/src/requirements.txt')) }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r src/requirements.txt
          pip install pytest pytest-cov moto

      - name: Run backend tests
        if: steps.params.outputs.run_tests != 'false'
        run: |
          cd backend
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"
          pytest tests/unit/ --cov=src --cov-report=xml --cov-report=term-missing

      - name: Handle backend test errors
        if: failure() && steps.params.outputs.run_tests != 'false'
        uses: ./.github/actions/error-handler
        with:
          workflow-name: 'Backend Deploy (AWS)'
          step-name: 'Run backend tests'
          error-category: 'backend'
          environment: ${{ steps.params.outputs.environment }}

      - name: Collect backend test failure artifacts
        if: failure() && steps.params.outputs.run_tests != 'false'
        uses: ./.github/actions/test-artifact-collector
        with:
          test-type: 'unit'
          working-directory: 'backend'
          collect-coverage: 'true'

      - name: Upload coverage to Codecov
        if: steps.params.outputs.run_tests != 'false'
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Set up AWS SAM CLI
        if: steps.params.outputs.skip_deploy != 'true'
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Pre-check CloudFormation Stack Status
        id: cfn_check
        if: steps.params.outputs.skip_deploy != 'true'
        run: |
          ENVIRONMENT="${{ steps.params.outputs.environment }}"
          STACK_NAME="excel-unlocker-api-$ENVIRONMENT"
          set +e
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null)
          RC=$?
          set -e
          if [ $RC -ne 0 ] || [ -z "$STATUS" ] || [ "$STATUS" = "None" ]; then
            STATUS="NOT_FOUND"
          fi
          echo "Detected stack status: $STATUS"
          # Allow deploy only for safe statuses
          case "$STATUS" in
            NOT_FOUND|DELETE_COMPLETE|CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
              CAN_DEPLOY="true" ;;
            *)
              CAN_DEPLOY="false" ;;
          esac
          echo "stack_status=$STATUS" >> $GITHUB_OUTPUT
          echo "can_deploy=$CAN_DEPLOY" >> $GITHUB_OUTPUT
          if [ "$CAN_DEPLOY" != "true" ]; then
            echo "::warning::Stack $STACK_NAME is in status '$STATUS' and cannot be updated. Delete the stack or use a new stack name, then retry." 
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.params.outputs.skip_deploy != 'true' && env.AWS_GITHUB_ACTIONS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: GitHubActions-Backend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: ${{ steps.params.outputs.skip_deploy != 'true' && env.AWS_GITHUB_ACTIONS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cache SAM build artifacts
        if: steps.params.outputs.skip_deploy != 'true'
        uses: actions/cache@v3
        with:
          path: .aws-sam
          key: ${{ format('{0}-sam-{1}', runner.os, hashFiles('template.yaml', 'backend/src/**')) }}
          restore-keys: |
            ${{ runner.os }}-sam-

      - name: SAM Build
        if: steps.params.outputs.skip_deploy != 'true'
        run: sam build --use-container

      - name: Deploy with AWS SAM
        if: steps.params.outputs.skip_deploy != 'true' && steps.cfn_check.outputs.can_deploy == 'true'
        run: |
          ENVIRONMENT="${{ steps.params.outputs.environment }}"
          ALLOWED="${{ secrets.ALLOWED_USERS }}"
          if [ -z "$ALLOWED" ]; then
            ALLOWED="admin@example.com"
          fi

      - name: Abort due to bad stack status
        if: steps.params.outputs.skip_deploy != 'true' && steps.cfn_check.outputs.can_deploy != 'true'
        run: |
          echo "❌ CloudFormation stack status '${{ steps.cfn_check.outputs.stack_status }}' prevents deployment."
          echo "🛠️ 対処: 'aws cloudformation delete-stack --stack-name excel-unlocker-api-${{ steps.params.outputs.environment }} --region ${{ env.AWS_REGION }}' で削除完了後に再実行してください。" 
          exit 1

          if [ "$ENVIRONMENT" = "production" ]; then
            sam deploy --config-env production --confirm-changeset \
              --parameter-overrides Environment=production AllowedUsers="$ALLOWED"
          elif [ "$ENVIRONMENT" = "staging" ]; then
            sam deploy --config-env staging --no-confirm-changeset --no-fail-on-empty-changeset \
              --parameter-overrides Environment=staging AllowedUsers="$ALLOWED"
          else
            sam deploy --config-env default --no-confirm-changeset --no-fail-on-empty-changeset \
              --parameter-overrides Environment=development AllowedUsers="$ALLOWED"
          fi

      - name: Handle SAM deployment errors
        if: failure() && steps.params.outputs.skip_deploy != 'true'
        uses: ./.github/actions/error-handler
        with:
          workflow-name: 'Backend Deploy (AWS)'
          step-name: 'Deploy with AWS SAM'
          error-category: 'deployment'
          environment: ${{ steps.params.outputs.environment }}

      - name: Get API Gateway URL
        id: api_url
        if: steps.params.outputs.skip_deploy != 'true'
        run: |
          ENVIRONMENT="${{ steps.params.outputs.environment }}"
          STACK_NAME="excel-unlocker-api-$ENVIRONMENT"
          # Try to fetch ApiUrl (present in template.yaml), then fallback to ApiGatewayUrl, then any execute-api URL
          ATTEMPTS=0
          API_URL=""
          while [ $ATTEMPTS -lt 6 ] && { [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; }; do
            API_URL=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
              --output text 2>/dev/null || echo "")
            if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
              API_URL=$(aws cloudformation describe-stacks \
                --stack-name "$STACK_NAME" \
                --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayUrl'].OutputValue" \
                --output text 2>/dev/null || echo "")
            fi
            if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
              API_URL=$(aws cloudformation describe-stacks \
                --stack-name "$STACK_NAME" \
                --query "Stacks[0].Outputs[?contains(OutputValue, 'execute-api')].OutputValue | [0]" \
                --output text 2>/dev/null || echo "")
            fi
            if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
              # Fallback: derive from stack resources (RestApi + Prod stage)
              REST_API_ID=$(aws cloudformation list-stack-resources \
                --stack-name "$STACK_NAME" \
                --query "StackResourceSummaries[?ResourceType=='AWS::ApiGateway::RestApi'].PhysicalResourceId | [0]" \
                --output text 2>/dev/null || echo "")
              if [ -n "$REST_API_ID" ] && [ "$REST_API_ID" != "None" ]; then
                API_URL="https://${REST_API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com/Prod"
              fi
            fi
            if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
              ATTEMPTS=$((ATTEMPTS+1))
              sleep 5
            fi
          done
          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            API_URL=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayUrl'].OutputValue" \
              --output text 2>/dev/null || echo "")
          fi
          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            API_URL=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?contains(OutputValue, 'execute-api')].OutputValue | [0]" \
              --output text 2>/dev/null || echo "")
          fi

          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            echo "⚠️ API Gateway URL not found for stack: $STACK_NAME"
            API_URL=""
          fi

          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "API Gateway URL: $API_URL"

      - name: Set up Node.js for Vercel updates
        if: steps.params.outputs.skip_deploy != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Update Vercel Environment Variables
        if: steps.params.outputs.skip_deploy != 'true'
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN || '' }}" ]; then
            echo "🔸 VERCEL_TOKEN is not set; skipping Vercel environment update"
            exit 0
          fi

          if [ -z "${{ steps.api_url.outputs.api_url }}" ]; then
            echo "🔸 API URL is not available; skipping Vercel environment update"
            exit 0
          fi

          npm install -g vercel
          cd frontend

          case "${{ steps.params.outputs.environment }}" in
            production)
              ENV_TARGET="production"
              ;;
            staging)
              ENV_TARGET="preview"
              ;;
            *)
              ENV_TARGET="development"
              ;;
          esac

          # Newer Vercel CLI does not support --stdin login; use per-command --token instead
          vercel link --yes --token "${{ secrets.VERCEL_TOKEN }}"

          echo "${{ steps.api_url.outputs.api_url }}" | vercel env add NEXT_PUBLIC_API_URL "$ENV_TARGET" --token "${{ secrets.VERCEL_TOKEN }}" || true
          echo "false" | vercel env add NEXT_PUBLIC_USE_MOCK_API "$ENV_TARGET" --token "${{ secrets.VERCEL_TOKEN }}" || true

      - name: Integration Test
        if: steps.params.outputs.skip_deploy != 'true'
        run: |
          API_URL="${{ steps.api_url.outputs.api_url }}"

          if [ -z "$API_URL" ]; then
            echo "🔸 API URL not available; skipping integration test"
            exit 0
          fi

          curl -f "$API_URL/health" || echo "Health endpoint not found (normal)"

          RESPONSE=$(curl -s -w "%{http_code}" -X POST "$API_URL/presigned-urls"             -H "Content-Type: application/json"             -H "Authorization: Bearer invalid-token"             -d '{"fileName": "test.xlsx", "fileSize": 1024, "contentType": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}')

          if [[ "$RESPONSE" == *"401"* ]] || [[ "$RESPONSE" == *"403"* ]]; then
            echo "✅ 認証エラー確認（期待通り）"
          else
            echo "⚠️ 認証テストの結果が予期しないものです: $RESPONSE"
          fi

      - name: Finalize workflow outputs
        id: finalize
        if: always()
        run: |
          API_URL="${{ steps.api_url.outputs.api_url }}"
          if [ -z "$API_URL" ]; then
            API_URL=""
          fi
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        if: always()
        run: |
          if [ "${{ steps.params.outputs.skip_deploy }}" = "true" ]; then
            echo "## 🧪 バックエンド検証のみ実行" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 実行情報" >> $GITHUB_STEP_SUMMARY
            echo "- **環境**: ${{ steps.params.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
            echo "- **実行内容**: テストのみ（デプロイはスキップ）" >> $GITHUB_STEP_SUMMARY
            echo "- **実行時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 実行結果" >> $GITHUB_STEP_SUMMARY
            echo "- **Python環境**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **依存関係インストール**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.params.outputs.run_tests }}" = "false" ]; then
              echo "- **バックエンドテスト**: ⏭️ スキップ" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **バックエンドテスト**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ job.status }}" != "success" ]; then
              echo "### ❌ エラー対処法" >> $GITHUB_STEP_SUMMARY
              echo "1. **テスト失敗**: \`cd backend && pytest\` でローカル確認" >> $GITHUB_STEP_SUMMARY
              echo "2. **依存関係エラー**: \`pip install -r backend/src/requirements.txt\`" >> $GITHUB_STEP_SUMMARY
              echo "3. **Python環境**: Python 3.9 の設定を確認" >> $GITHUB_STEP_SUMMARY
              echo "4. **詳細ログ**: 上記のステップログを確認" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ **検証完了** - テストが正常に実行されました" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## 🚀 AWS デプロイ完了" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 実行情報" >> $GITHUB_STEP_SUMMARY
            echo "- **環境**: ${{ steps.params.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
            echo "- **デプロイ時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
            echo "- **認証方式**: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN != '' && 'GitHub OIDC' || 'アクセスキー' }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 実行結果" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.params.outputs.run_tests }}" = "false" ]; then
              echo "- **バックエンドテスト**: ⏭️ スキップ" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **バックエンドテスト**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
            fi
            echo "- **SAMビルド**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **AWSデプロイ**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Vercel環境変数更新**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **統合テスト**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### デプロイ情報" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.finalize.outputs.api_url }}" != "" ]; then
              echo "- **API Gateway URL**: ${{ steps.finalize.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ job.status }}" != "success" ]; then
              echo "### ❌ エラー対処法" >> $GITHUB_STEP_SUMMARY
              echo "1. **テスト失敗**: \`cd backend && pytest\` でローカル確認" >> $GITHUB_STEP_SUMMARY
              echo "2. **AWS認証エラー**: GitHub Secrets の AWS 設定を確認" >> $GITHUB_STEP_SUMMARY
              echo "3. **SAMエラー**: \`sam build && sam deploy\` をローカルで実行" >> $GITHUB_STEP_SUMMARY
              echo "4. **Vercelエラー**: VERCEL_TOKEN の有効性を確認" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "📖 **参考資料**: [AWS設定ガイド](https://github.com/${{ github.repository }}/blob/main/docs/deployment-guide.md)" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ **AWSデプロイ完了** - バックエンドが利用可能です" >> $GITHUB_STEP_SUMMARY
              if [ "${{ steps.finalize.outputs.api_url }}" != "" ]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "🔗 **API エンドポイント**: ${{ steps.finalize.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi
