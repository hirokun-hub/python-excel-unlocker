name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ環境'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      skip_deploy:
        description: 'デプロイ処理をスキップしテストのみ実行'
        required: false
        default: false
        type: boolean
      api_url:
        description: 'API Gateway URL（任意）'
        required: false
        default: ''
        type: string

jobs:
  frontend:
    name: Frontend validation and deployment
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'staging') || (github.ref == 'refs/heads/develop' && 'development') || (github.base_ref == 'main' && 'staging') || 'development' }}
      skip_deploy: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_deploy == 'true') }}
      api_url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.api_url || '' }}
    secrets: inherit
