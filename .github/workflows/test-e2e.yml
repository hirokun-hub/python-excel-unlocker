name: 🎭 E2E Test Suite

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        default: '18'
        type: string

jobs:
  e2e-test:
    name: 🎭 End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📚 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🎭 Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: 🏗️ Build application
        working-directory: ./frontend
        run: npm run build

      - name: 🚀 Start application
        working-directory: ./frontend
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-e2e
          GOOGLE_CLIENT_ID: ${{ secrets.TEST_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_CLIENT_SECRET }}

      - name: 🎭 Run E2E tests
        working-directory: ./frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: 📊 Upload E2E test report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  e2e-test-mobile:
    name: 📱 Mobile E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📚 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🎭 Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: 🏗️ Build application
        working-directory: ./frontend
        run: npm run build

      - name: 🚀 Start application
        working-directory: ./frontend
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-e2e-mobile

      - name: 📱 Run mobile E2E tests
        working-directory: ./frontend
        run: npx playwright test --project=mobile
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: 📊 Upload mobile E2E test report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: mobile-e2e-test-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  accessibility-test:
    name: ♿ Accessibility Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📚 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build application
        working-directory: ./frontend
        run: npm run build

      - name: 🚀 Start application
        working-directory: ./frontend
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: ♿ Run accessibility tests
        working-directory: ./frontend
        run: npm run test:a11y
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: 📊 Upload accessibility test report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: accessibility-test-report
          path: frontend/accessibility-report/
          retention-days: 7