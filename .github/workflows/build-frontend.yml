name: "[Reusable] Frontend - Build"

on:
  workflow_call:
    inputs:
      environment:
        description: 'The deployment environment (development, staging, production)'
        required: true
        type: string
      api_url:
        description: 'The API Gateway URL (optional)'
        required: false
        type: string
    secrets:
      VERCEL_TOKEN:
        description: 'Vercel access token used for CLI authentication'
        required: true
      VERCEL_ORG_ID:
        description: 'Identifier for the Vercel organization'
        required: true
      VERCEL_PROJECT_ID:
        description: 'Identifier for the Vercel project'
        required: true
    outputs:
      build-success:
        description: "Indicates whether the build was successful"
        value: ${{ jobs.build.outputs.build-success }}
      api_url:
        description: "The API URL used for the build"
        value: ${{ jobs.build.outputs.api_url }}

jobs:
  build:
    name: Build with Vercel
    runs-on: ubuntu-latest
    outputs:
      build-success: ${{ steps.set-output.outputs.build-success }}
      api_url: ${{ steps.build-meta.outputs.api_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Prepare build metadata
        id: build-meta
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          API_URL="${{ inputs.api_url }}"

          if [ -z "$API_URL" ]; then
            case "$ENVIRONMENT" in
              production)
                API_URL="https://api.excel-unlocker.prod.amazonaws.com/Prod"
                ;;
              staging)
                API_URL="https://api.excel-unlocker.staging.amazonaws.com/Prod"
                ;;
              *)
                API_URL="https://api.excel-unlocker.dev.amazonaws.com/Prod"
                ;;
            esac
          fi

          if [ "$ENVIRONMENT" = "production" ]; then
            VERCEL_ENV="production"
            BUILD_ARG="--prod"
          elif [ "$ENVIRONMENT" = "staging" ]; then
            VERCEL_ENV="preview"
            BUILD_ARG=""
          else
            VERCEL_ENV="development"
            BUILD_ARG=""
          fi

          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "vercel_env=$VERCEL_ENV" >> $GITHUB_OUTPUT
          echo "build_arg=$BUILD_ARG" >> $GITHUB_OUTPUT

      - name: Pull Vercel environment information
        run: vercel pull --cwd frontend --yes --environment=${{ steps.build-meta.outputs.vercel_env }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Normalize Vercel project root
        run: python3 .github/scripts/normalize_vercel_project.py

      - name: Build project artifacts with Vercel
        run: |
          ARGS="${{ steps.build-meta.outputs.build_arg }}"
          if [ -n "$ARGS" ]; then
            vercel build --cwd frontend --token=${{ secrets.VERCEL_TOKEN }} $ARGS
          else
            vercel build --cwd frontend --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ steps.build-meta.outputs.api_url }}
          NEXT_PUBLIC_USE_MOCK_API: 'false'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build-output
          path: frontend/.vercel/output
          retention-days: 1

      - name: Set build output
        id: set-output
        run: echo "build-success=true" >> $GITHUB_OUTPUT

      - name: Build Summary
        if: always()
        run: |
          echo "## 🏗️ フロントエンドビルド結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ビルド情報" >> $GITHUB_STEP_SUMMARY
          echo "- **環境**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL**: ${{ steps.build-meta.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Vercel環境**: ${{ steps.build-meta.outputs.vercel_env }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ビルド時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 実行結果" >> $GITHUB_STEP_SUMMARY
          echo "- **依存関係インストール**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Vercel設定取得**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ビルド実行**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **アーティファクト保存**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" != "success" ]; then
            echo "### ❌ エラー対処法" >> $GITHUB_STEP_SUMMARY
            echo "1. **依存関係エラー**: \`npm ci\` をローカルで実行して確認" >> $GITHUB_STEP_SUMMARY
            echo "2. **Vercel設定エラー**: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID を確認" >> $GITHUB_STEP_SUMMARY
            echo "3. **ビルドエラー**: \`npm run build\` をローカルで実行" >> $GITHUB_STEP_SUMMARY
            echo "4. **環境変数エラー**: NEXT_PUBLIC_API_URL の設定を確認" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📖 **参考資料**: [Vercel設定ガイド](https://github.com/${{ github.repository }}/blob/main/docs/vercel-setup-detailed-guide.md)" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **ビルド完了** - デプロイステップに進めます" >> $GITHUB_STEP_SUMMARY
          fi
