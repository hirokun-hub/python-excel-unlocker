name: 🚦 CI (AI-first, lightweight)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ai-artifacts:
    name: 🧭 Collect AI Artifacts
    uses: ./.github/workflows/ai-artifacts.yml
    with:
      run_jest: false
      run_pytest: false
    secrets: inherit

