name: AI Artifacts (Reusable)

on:
  workflow_call:
    inputs:
      collect-test-results:
        description: 'Whether to collect test results from previous jobs'
        required: false
        default: true
        type: boolean

jobs:
  ai-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          separator: "\n"

      - name: Show changed files (debug)
        run: |
          echo "${{ steps.changed.outputs.all_changed_files }}"

      - name: Prepare dirs
        run: |
          mkdir -p project-metadata test-results analysis_data

      # --- 他のワークフローからテスト結果をダウンロード ---
      - name: Download test artifacts
        if: inputs.collect-test-results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-results'
          path: test-results/
          merge-multiple: true
        continue-on-error: true

      - name: Download coverage artifacts
        if: inputs.collect-test-results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-coverage'
          path: test-results/coverage/
          merge-multiple: true
        continue-on-error: true

      - name: List repository files (relative paths)
        run: |
          git ls-files > project-metadata/file-structure.txt

      - name: Summarize diff (numstat -> change-map.json)
        run: |
          git diff --numstat HEAD~1 HEAD | awk '{print "{\"added\":"$1",\"deleted\":"$2",\"file\":\""$3"\"}"}' | jq -s '.' > project-metadata/change-map.json || echo "[]">project-metadata/change-map.json

      # ------- Frontend (if Node project exists) -------
      - name: Setup Node
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node deps (npm ci)
        if: hashFiles('frontend/package-lock.json') != '' && hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Type check (changed only)
        if: hashFiles('frontend/tsconfig.json') != '' && steps.changed.outputs.all_changed_files != ''
        working-directory: frontend
        run: |
          CHANGED=$(printf "%s" "${{ steps.changed.outputs.all_changed_files }}" | grep -E 'frontend/.*\.(ts|tsx)$' || true)
          if [ -n "$CHANGED" ]; then npx tsc --noEmit --pretty false $CHANGED | tee ../test-results/tsc.log || true; fi

      - name: ESLint (changed only, JSON)
        if: hashFiles('frontend/.eslintrc*') != '' && steps.changed.outputs.all_changed_files != ''
        working-directory: frontend
        run: |
          CHANGED=$(printf "%s" "${{ steps.changed.outputs.all_changed_files }}" | grep -E 'frontend/' | sed 's|frontend/||' | tr '\n' ' ')
          if [ -n "$CHANGED" ]; then npx eslint -f json $CHANGED > ../test-results/eslint.json || echo "[]" > ../test-results/eslint.json; fi

      - name: Frontend tests (find related)
        if: hashFiles('frontend/package.json') != '' && steps.changed.outputs.all_changed_files != ''
        working-directory: frontend
        env:
          JEST_JUNIT_OUTPUT: ../test-results/junit-fe.xml
        run: |
          CHANGED=$(printf "%s" "${{ steps.changed.outputs.all_changed_files }}" | grep -E 'frontend/' | sed 's|frontend/||' | tr '\n' ' ')
          if [ -n "$CHANGED" ]; then npx jest --ci --runInBand --reporters=default --reporters=jest-junit --findRelatedTests $CHANGED || true; fi
          # coverageは有れば拾う（設定任せ）
          if [ -d coverage ]; then jq -n --arg exists "true" '{coverageExists:$exists}' > ../test-results/coverage-fe.json; else jq -n '{coverageExists:false}' > ../test-results/coverage-fe.json; fi

      - name: NPM dependency tree (JSON)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          (npm ls --all --json > ../project-metadata/npm-deps.json) || echo "{}" > ../project-metadata/npm-deps.json

      # ------- Backend (if Python project exists) -------
      - name: Setup Python
        if: hashFiles('backend/src/requirements.txt') != '' || hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        if: hashFiles('backend/src/requirements.txt') != ''
        run: pip install -r backend/src/requirements.txt || true

      - name: Backend tests (nearby only)
        if: hashFiles('backend/src/requirements.txt') != '' && steps.changed.outputs.all_changed_files != ''
        run: |
          mkdir -p test-results
          # 変更ファイルのディレクトリに近いテストをおおまかに実行
          TARGETS=$(printf "%s" "${{ steps.changed.outputs.all_changed_files }}" | grep -E 'backend/' | sed 's#/[^/]*$##' | sort -u | tr '\n' ' ')
          if [ -n "$TARGETS" ]; then pytest backend/tests/ -q --maxfail=1 --disable-warnings --junitxml=test-results/junit-be.xml || true; fi

      - name: Pip freeze
        if: hashFiles('backend/src/requirements.txt') != '' || hashFiles('pyproject.toml') != ''
        run: pip freeze > project-metadata/pip-freeze.txt || true

      # ------- Dependency diff (lockfiles) -------
      - name: Dependency lock diff summary
        run: |
          BASE=$(git rev-parse HEAD~1)
          {
            echo '['
            git diff --name-only $BASE HEAD | grep -E '(^|/)(package-lock\.json|pnpm-lock\.yaml|requirements\.txt)$' | while read f; do
              echo "{\"file\":\"$f\"}"
            done
            echo ']'
          } > project-metadata/dependency-diff.json || echo "[]" > project-metadata/dependency-diff.json

      # ------- Package everything -------
      - name: Zip AI analysis package
        run: |
          zip -r ai-analysis-package.zip project-metadata test-results analysis_data || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis-package
          path: |
            ai-analysis-package.zip
            project-metadata/**
            test-results/**
            analysis_data/**