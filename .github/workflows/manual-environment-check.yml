name: "[Manual] Verify Deployment Configuration"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment to reference during the check"
        type: choice
        required: false
        options:
          - development
          - staging
          - production
        default: staging

jobs:
  verify:
    name: Inspect AWS and Vercel configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Evaluate required secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set +e
          summary_file="$GITHUB_STEP_SUMMARY"
          mkdir -p "$(dirname "$summary_file")"

          echo "## Deployment configuration check" > "$summary_file"
          echo "" >> "$summary_file"
          if [ -n "$ENVIRONMENT" ]; then
            echo "- environment input: $ENVIRONMENT" >> "$summary_file"
          else
            echo "- environment input: (not provided)" >> "$summary_file"
          fi
          echo "" >> "$summary_file"

          result=0

          echo "### AWS credentials" >> "$summary_file"
          aws_oidc_ok=0
          aws_key_ok=1

          if [ -n "$AWS_ROLE_ARN" ]; then
            echo "- [x] AWS_GITHUB_ACTIONS_ROLE_ARN" >> "$summary_file"
            aws_oidc_ok=1
          else
            echo "- [ ] AWS_GITHUB_ACTIONS_ROLE_ARN" >> "$summary_file"
          fi

          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            echo "- [x] AWS_ACCESS_KEY_ID" >> "$summary_file"
          else
            echo "- [ ] AWS_ACCESS_KEY_ID" >> "$summary_file"
            aws_key_ok=0
          fi

          if [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "- [x] AWS_SECRET_ACCESS_KEY" >> "$summary_file"
          else
            echo "- [ ] AWS_SECRET_ACCESS_KEY" >> "$summary_file"
            aws_key_ok=0
          fi

          if [ $aws_oidc_ok -eq 0 ] && [ $aws_key_ok -eq 0 ]; then
            echo "" >> "$summary_file"
            echo "AWS configuration is incomplete. Provide AWS_GITHUB_ACTIONS_ROLE_ARN for OIDC, or both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for access key authentication." >> "$summary_file"
            echo "" >> "$summary_file"
            echo "::error ::AWS credentials are not fully configured." >&2
            result=1
          fi

          echo "" >> "$summary_file"
          echo "### Backend specific secrets" >> "$summary_file"
          if [ -n "$ALLOWED_USERS" ]; then
            echo "- [x] ALLOWED_USERS" >> "$summary_file"
          else
            echo "- [ ] ALLOWED_USERS" >> "$summary_file"
            echo "::error ::ALLOWED_USERS secret is missing." >&2
            result=1
          fi

          echo "" >> "$summary_file"
          echo "### Vercel deployment" >> "$summary_file"
          vercel_missing=0
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "- [x] VERCEL_TOKEN" >> "$summary_file"
          else
            echo "- [ ] VERCEL_TOKEN" >> "$summary_file"
            vercel_missing=1
          fi

          if [ -n "$VERCEL_ORG_ID" ]; then
            echo "- [x] VERCEL_ORG_ID" >> "$summary_file"
          else
            echo "- [ ] VERCEL_ORG_ID" >> "$summary_file"
            vercel_missing=1
          fi

          if [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "- [x] VERCEL_PROJECT_ID" >> "$summary_file"
          else
            echo "- [ ] VERCEL_PROJECT_ID" >> "$summary_file"
            vercel_missing=1
          fi

          if [ $vercel_missing -ne 0 ]; then
            echo "" >> "$summary_file"
            echo "Vercel configuration is incomplete. Ensure the token, organization ID, and project ID are added as repository secrets." >> "$summary_file"
            echo "" >> "$summary_file"
            echo "::error ::Vercel secrets are missing." >&2
            result=1
          fi

          if [ $result -eq 0 ]; then
            echo "" >> "$summary_file"
            echo "All required secrets are configured. You can proceed with deployment workflows." >> "$summary_file"
          fi

          exit $result
