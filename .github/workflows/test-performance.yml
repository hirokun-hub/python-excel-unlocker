name: ⚡ Performance Test Suite

on:
  workflow_call:
    inputs:
      target-url:
        description: 'Target URL for performance testing'
        required: false
        default: 'https://secure-excel-unlock.vercel.app'
        type: string
      node-version:
        description: 'Node.js version to use'
        required: false
        default: '18'
        type: string

jobs:
  load-test:
    name: ⚡ Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: 📚 Install Artillery
        run: npm install -g artillery@latest

      - name: ⚡ Run load tests
        run: |
          artillery run tests/performance/load-test.yml \
            --target ${{ inputs.target-url }} \
            --output load-test-results.json
        continue-on-error: true

      - name: 📊 Generate load test report
        run: |
          artillery report load-test-results.json \
            --output load-test-report.html

      - name: 📈 Parse performance metrics
        run: |
          # パフォーマンスメトリクスの解析
          echo "## 📊 Load Test Results" >> $GITHUB_STEP_SUMMARY
          
          # P95レスポンス時間の確認
          P95_TIME=$(cat load-test-results.json | jq -r '.aggregate.latency.p95')
          echo "P95 Response Time: ${P95_TIME}ms" >> $GITHUB_STEP_SUMMARY
          
          # 目標値（8秒 = 8000ms）との比較
          if (( $(echo "$P95_TIME > 8000" | bc -l) )); then
            echo "❌ P95 time ${P95_TIME}ms exceeds target of 8000ms" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ P95 time ${P95_TIME}ms meets target of <8000ms" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📋 Upload load test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: |
            load-test-results.json
            load-test-report.html
          retention-days: 30

  stress-test:
    name: 🔥 Stress Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: 📚 Install Artillery
        run: npm install -g artillery@latest

      - name: 🔥 Run stress tests
        run: |
          artillery run tests/performance/stress-test.yml \
            --target ${{ inputs.target-url }} \
            --output stress-test-results.json
        continue-on-error: true

      - name: 📊 Generate stress test report
        run: |
          artillery report stress-test-results.json \
            --output stress-test-report.html

      - name: 📈 Parse stress test metrics
        run: |
          echo "## 🔥 Stress Test Results" >> $GITHUB_STEP_SUMMARY
          
          # エラー率の確認
          ERROR_RATE=$(cat stress-test-results.json | jq -r '.aggregate.errors | length')
          TOTAL_REQUESTS=$(cat stress-test-results.json | jq -r '.aggregate.counters."http.requests"')
          ERROR_PERCENTAGE=$(echo "scale=2; $ERROR_RATE * 100 / $TOTAL_REQUESTS" | bc)
          
          echo "Error Rate: ${ERROR_PERCENTAGE}%" >> $GITHUB_STEP_SUMMARY
          
          # 目標値（5%未満）との比較
          if (( $(echo "$ERROR_PERCENTAGE > 5" | bc -l) )); then
            echo "❌ Error rate ${ERROR_PERCENTAGE}% exceeds target of <5%" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Error rate ${ERROR_PERCENTAGE}% meets target of <5%" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📋 Upload stress test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-test-results
          path: |
            stress-test-results.json
            stress-test-report.html
          retention-days: 30

  lighthouse-audit:
    name: 🏠 Lighthouse Performance Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏠 Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ inputs.target-url }}
          configPath: './tests/performance/lighthouse.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: 📊 Parse Lighthouse results
        run: |
          echo "## 🏠 Lighthouse Performance Audit" >> $GITHUB_STEP_SUMMARY
          echo "Performance audit completed for ${{ inputs.target-url }}" >> $GITHUB_STEP_SUMMARY

  performance-summary:
    name: 📊 Performance Test Summary
    runs-on: ubuntu-latest
    needs: [load-test, stress-test, lighthouse-audit]
    if: always()

    steps:
      - name: 📊 Create performance summary
        run: |
          echo "# 📊 Performance Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results Overview" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 Target URL: ${{ inputs.target-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ Load Test: ${{ needs.load-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔥 Stress Test: ${{ needs.stress-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🏠 Lighthouse Audit: ${{ needs.lighthouse-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Performance Targets" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ P95 Response Time: <8 seconds" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Error Rate: <5%" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Concurrent Users: 50+" >> $GITHUB_STEP_SUMMARY