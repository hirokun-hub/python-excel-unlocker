name: "[Reusable] Frontend - Validate"

on:
  workflow_call:
    outputs:
      validation-success:
        description: "Indicates whether validation was successful"
        value: ${{ jobs.validate.outputs.validation-success }}

jobs:
  validate:
    name: Run Lint, Type-check and Tests
    runs-on: ubuntu-latest
    outputs:
      validation-success: ${{ steps.set-output.outputs.validation-success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run type checking
        working-directory: frontend
        run: npm run type-check

      - name: Handle type checking errors
        if: failure()
        uses: ./.github/actions/error-handler
        with:
          workflow-name: 'Frontend Validation'
          step-name: 'Run type checking'
          error-category: 'frontend'

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Handle linting errors
        if: failure()
        uses: ./.github/actions/error-handler
        with:
          workflow-name: 'Frontend Validation'
          step-name: 'Run linting'
          error-category: 'frontend'

      - name: Run unit tests
        working-directory: frontend
        run: npm run test -- --coverage --watchAll=false

      - name: Handle unit test errors
        if: failure()
        uses: ./.github/actions/error-handler
        with:
          workflow-name: 'Frontend Validation'
          step-name: 'Run unit tests'
          error-category: 'test'

      - name: Collect test failure artifacts
        if: failure()
        uses: ./.github/actions/test-artifact-collector
        with:
          test-type: 'unit'
          working-directory: 'frontend'
          collect-coverage: 'true'

      - name: Set validation output
        id: set-output
        run: echo "validation-success=true" >> $GITHUB_OUTPUT

      - name: Validation Summary
        if: always()
        run: |
          echo "## 🔍 フロントエンド検証結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 実行内容" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript型チェック**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ESLint**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **単体テスト**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 実行情報" >> $GITHUB_STEP_SUMMARY
          echo "- **実行時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js バージョン**: 18" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" != "success" ]; then
            echo "### ❌ エラー対処法" >> $GITHUB_STEP_SUMMARY
            echo "1. **型エラー**: \`npm run type-check\` でローカル確認" >> $GITHUB_STEP_SUMMARY
            echo "2. **Lintエラー**: \`npm run lint -- --fix\` で自動修正" >> $GITHUB_STEP_SUMMARY
            echo "3. **テスト失敗**: \`npm run test\` でローカル実行" >> $GITHUB_STEP_SUMMARY
            echo "4. **詳細ログ**: 上記のステップログを確認" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **検証完了** - ビルドステップに進めます" >> $GITHUB_STEP_SUMMARY
          fi
