name: Reusable Frontend - Validate

on:
  workflow_call:
    outputs:
      validation-success:
        description: "Indicates whether validation was successful"
        value: ${{ jobs.validate.outputs.validation-success }}

jobs:
  validate:
    name: Run Lint, Type-check and Tests
    runs-on: ubuntu-latest
    outputs:
      validation-success: ${{ steps.set-output.outputs.validation-success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run type checking
        working-directory: frontend
        run: npm run type-check

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: frontend
        run: npm run test -- --coverage --watchAll=false

      - name: Set validation output
        id: set-output
        run: echo "validation-success=true" >> $GITHUB_OUTPUT
