name: 🔗 Integration Test Suite

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        default: '18'
        type: string

jobs:
  api-integration-test:
    name: 🔗 API Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: 📚 Install Newman CLI
        run: npm install -g newman newman-reporter-htmlextra

      - name: 🔗 Run API integration tests
        run: |
          newman run tests/api/secure-excel-unlock.postman_collection.json \
            --environment tests/api/test.postman_environment.json \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export results/api-test-results.xml \
            --reporter-htmlextra-export results/api-test-report.html
        continue-on-error: true

      - name: 📊 Publish API test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: API Integration Test Results
          path: results/api-test-results.xml
          reporter: java-junit

      - name: 📋 Upload API test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-integration-test-results
          path: |
            results/api-test-results.xml
            results/api-test-report.html
          retention-days: 7

  auth-flow-test:
    name: 🔐 Authentication Flow Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: 📚 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔐 Test Google OAuth integration
        working-directory: ./frontend
        run: npm run test:auth
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.TEST_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_CLIENT_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-integration

      - name: 📋 Upload auth test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-integration-test-results
          path: frontend/test-results/auth/
          retention-days: 7

  s3-integration-test:
    name: ☁️ AWS S3 Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📚 Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest moto[s3]

      - name: ☁️ Test S3 integration with moto
        working-directory: ./backend
        run: pytest tests/integration/test_s3_integration.py -v
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing

      - name: 📋 Upload S3 integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-integration-test-results
          path: backend/test-results/integration/
          retention-days: 7