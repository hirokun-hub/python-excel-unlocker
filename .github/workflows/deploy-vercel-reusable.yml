name: "[Reusable] Frontend - Deploy to Vercel"

on:
  workflow_call:
    inputs:
      environment:
        description: 'The deployment environment (development, staging, production)'
        required: true
        type: string
      api_url:
        description: 'Optional API endpoint to associate with this deployment'
        required: false
        type: string
    secrets:
      VERCEL_TOKEN:
        description: 'Vercel access token used for CLI authentication'
        required: true
      VERCEL_ORG_ID:
        description: 'Identifier for the Vercel organization'
        required: true
      VERCEL_PROJECT_ID:
        description: 'Identifier for the Vercel project'
        required: true
    outputs:
      deploy-success:
        description: "Indicates whether the deployment was successful"
        value: ${{ jobs.deploy.outputs.deploy-success }}
      vercel-url:
        description: "The URL of the Vercel deployment"
        value: ${{ jobs.deploy.outputs.vercel-url }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    outputs:
      deploy-success: ${{ steps.set-output.outputs.deploy-success }}
      vercel-url: ${{ steps.deploy.outputs.vercel-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-build-output
          path: frontend/.vercel/output

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: |
          case "${{ inputs.environment }}" in
            production)
              VERCEL_ENV="production"
              ;;
            staging)
              VERCEL_ENV="preview"
              ;;
            *)
              VERCEL_ENV="development"
              ;;
          esac
          vercel pull --cwd frontend --yes --environment=$VERCEL_ENV --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Normalize Vercel project root
        run: python3 .github/scripts/normalize_vercel_project.py

      - name: Prepare deployment metadata
        id: deploy-meta
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          if [ "$ENVIRONMENT" = "production" ]; then
            DEPLOY_ARG="--prod"
          else
            DEPLOY_ARG=""
          fi
          echo "deploy_arg=$DEPLOY_ARG" >> $GITHUB_OUTPUT

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_ARGS="--cwd frontend --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes"
          if [ "${{ steps.deploy-meta.outputs.deploy_arg }}" = "--prod" ]; then
            DEPLOY_ARGS="$DEPLOY_ARGS --prod"
          fi

          DEPLOYMENT_OUTPUT=$(vercel deploy $DEPLOY_ARGS)
          echo "$DEPLOYMENT_OUTPUT"

          DEPLOYMENT_URL=$(echo "$DEPLOYMENT_OUTPUT" | tail -n1 | tr -d '[:space:]')
          if [ -z "$DEPLOYMENT_URL" ]; then
            DEPLOYMENT_URL="https://excel-unlocker.vercel.app"
          fi

          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "vercel-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Handle Vercel deployment errors
        if: failure()
        uses: ./.github/actions/error-handler
        with:
          workflow-name: 'Frontend Deploy (Vercel)'
          step-name: 'Deploy to Vercel'
          error-category: 'deployment'
          environment: ${{ inputs.environment }}

      - name: Set deployment output
        id: set-output
        run: echo "deploy-success=true" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Vercel デプロイ結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### デプロイ情報" >> $GITHUB_STEP_SUMMARY
          echo "- **環境**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **デプロイURL**: ${{ steps.deploy.outputs.vercel-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL**: ${{ inputs.api_url || 'デフォルト設定' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **デプロイ時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 実行結果" >> $GITHUB_STEP_SUMMARY
          echo "- **アーティファクト取得**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Vercel設定**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **デプロイ実行**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" != "success" ]; then
            echo "### ❌ エラー対処法" >> $GITHUB_STEP_SUMMARY
            echo "1. **アーティファクトエラー**: ビルドステップが正常完了しているか確認" >> $GITHUB_STEP_SUMMARY
            echo "2. **Vercel認証エラー**: VERCEL_TOKEN の有効性を確認" >> $GITHUB_STEP_SUMMARY
            echo "3. **プロジェクト設定エラー**: VERCEL_ORG_ID, VERCEL_PROJECT_ID を確認" >> $GITHUB_STEP_SUMMARY
            echo "4. **デプロイエラー**: Vercelダッシュボードでプロジェクト状態を確認" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📖 **参考資料**: [Vercel設定ガイド](https://github.com/${{ github.repository }}/blob/main/docs/vercel-setup-detailed-guide.md)" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **デプロイ完了** - アプリケーションが利用可能です" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **アクセス**: [${{ steps.deploy.outputs.vercel-url }}](${{ steps.deploy.outputs.vercel-url }})" >> $GITHUB_STEP_SUMMARY
          fi
