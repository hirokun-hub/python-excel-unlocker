name: "[Pipeline] Platform - Deploy"

permissions:
  contents: read
  actions: read
  id-token: write

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'template.yaml'
      - 'samconfig.toml'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'template.yaml'
      - 'samconfig.toml'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      deploy_frontend:
        description: 'Execute frontend deployment steps'
        required: false
        default: true
        type: boolean
      run_frontend_e2e:
        description: 'Run frontend E2E tests after deployment'
        required: false
        default: false
        type: boolean
      deploy_backend:
        description: 'Execute backend deployment steps'
        required: false
        default: true
        type: boolean

concurrency:
  group: platform-${{ github.repository }}-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'staging') || (github.ref == 'refs/heads/develop' && 'development') || (github.base_ref == 'main' && 'staging') || 'development' }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PLATFORM_ENVIRONMENT: &platform_environment ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'staging') || (github.ref == 'refs/heads/develop' && 'development') || (github.base_ref == 'main' && 'staging') || 'development' }}

jobs:
  frontend_tests:
    name: Frontend Tests
    uses: ./.github/workflows/validate-frontend.yml
    secrets: inherit

  backend_tests:
    name: Backend Tests
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: *platform_environment
      skip_deploy: true
      run_tests: true
    secrets: inherit

  frontend_deploy:
    name: Frontend Deploy
    needs: [frontend_tests, backend_tests]
    if: ${{ needs.frontend_tests.result == 'success' && needs.backend_tests.result == 'success' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_frontend != 'false') }}
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: *platform_environment
      run_validation: false
      skip_e2e: ${{ !((github.event_name == 'workflow_dispatch' && github.event.inputs.run_frontend_e2e == 'true') || (github.event_name == 'push' && github.ref != 'refs/heads/main')) }}
    secrets: inherit

  backend_deploy:
    name: Backend Deploy
    needs: [frontend_tests, backend_tests]
    if: ${{ needs.frontend_tests.result == 'success' && needs.backend_tests.result == 'success' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_backend != 'false') }}
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: *platform_environment
      skip_deploy: false
      run_tests: false
    secrets: inherit

  platform_summary:
    name: Platform Summary
    needs: [frontend_tests, backend_tests, frontend_deploy, backend_deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summarize overall results
        run: |
          echo "## 🚀 プラットフォーム統合ワークフロー" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 実行情報" >> $GITHUB_STEP_SUMMARY
          echo "- **トリガー**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ブランチ**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **環境**: ${{ env.PLATFORM_ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **実行時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### テスト結果" >> $GITHUB_STEP_SUMMARY
          echo "- **フロントエンドテスト**: ${{ needs.frontend_tests.result == 'success' && '✅ 成功' || needs.frontend_tests.result == 'skipped' && '⏭️ スキップ' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **バックエンドテスト**: ${{ needs.backend_tests.result == 'success' && '✅ 成功' || needs.backend_tests.result == 'skipped' && '⏭️ スキップ' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### デプロイ結果" >> $GITHUB_STEP_SUMMARY
          echo "- **フロントエンド**: ${{ needs.frontend_deploy.result == 'success' && '✅ 成功' || needs.frontend_deploy.result == 'skipped' && '⏭️ スキップ' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **バックエンド**: ${{ needs.backend_deploy.result == 'success' && '✅ 成功' || needs.backend_deploy.result == 'skipped' && '⏭️ スキップ' || '❌ 失敗' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.frontend_deploy.outputs.vercel-url || '' }}" != "" ]; then
            echo "### フロントエンド" >> $GITHUB_STEP_SUMMARY
            echo "- **デプロイURL**: ${{ needs.frontend_deploy.outputs.vercel-url }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.backend_deploy.outputs.api_url || '' }}" != "" ]; then
            echo "### バックエンド" >> $GITHUB_STEP_SUMMARY
            echo "- **API URL**: ${{ needs.backend_deploy.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.frontend_deploy.result }}" != "success" ] || [ "${{ needs.backend_deploy.result }}" != "success" ]; then
            echo "### ❌ エラー対処ヒント" >> $GITHUB_STEP_SUMMARY
            echo "1. 各ワークフローのログとSummaryを確認" >> $GITHUB_STEP_SUMMARY
            echo "2. Secrets や設定値を再確認" >> $GITHUB_STEP_SUMMARY
            echo "3. 必要に応じて個別ワークフローの手動実行で切り分け" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ すべての処理が完了しました" >> $GITHUB_STEP_SUMMARY
          fi
