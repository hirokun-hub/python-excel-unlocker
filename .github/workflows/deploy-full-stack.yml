name: '[Full Stack] Deploy All'

on:
  # 手動実行のみ（安全のため）
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ環境'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production
      skip_tests:
        description: 'テストをスキップ'
        required: false
        default: false
        type: boolean

jobs:
  # Step 1: AWSデプロイ
  deploy-aws:
    name: Deploy Backend (AWS)
    uses: ./.github/workflows/deploy-aws.yml
    with:
      environment: ${{ github.event.inputs.environment }}
    secrets: inherit

  # Step 2: Vercelデプロイ（AWS完了後）
  deploy-vercel:
    name: Deploy Frontend (Vercel)
    needs: deploy-aws
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      environment: ${{ github.event.inputs.environment }}
      api_url: ${{ needs.deploy-aws.outputs.api-url }}
    secrets: inherit

  # Step 3: 統合テスト
  integration-test:
    name: Integration Test
    needs: [deploy-aws, deploy-vercel]
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.skip_tests }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-1

    - name: Get deployment URLs
      id: get-urls
      run: |
        # AWS API Gateway URL取得
        STACK_NAME="excel-unlocker-api-${{ github.event.inputs.environment }}"
        API_URL=$(aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayUrl'].OutputValue" \
          --output text)
        echo "api-url=$API_URL" >> $GITHUB_OUTPUT
        
        # Vercel URL取得（deploy-vercelジョブの出力から）
        VERCEL_URL="${{ needs.deploy-vercel.outputs.vercel-url }}"
        if [ -z "$VERCEL_URL" ]; then
          VERCEL_URL="https://excel-unlocker.vercel.app"  # フォールバック
        fi
        echo "vercel-url=$VERCEL_URL" >> $GITHUB_OUTPUT
        
        echo "API URL: $API_URL"
        echo "Vercel URL: $VERCEL_URL"

    - name: Run integration tests
      run: |
        # 統合テストディレクトリが存在するかチェック
        if [ -d "tests/integration" ]; then
          cd tests/integration
          npm install
          
          # 環境変数設定
          export NEXT_PUBLIC_API_URL="${{ steps.get-urls.outputs.api-url }}"
          export FRONTEND_URL="${{ steps.get-urls.outputs.vercel-url }}"
          export TEST_ENVIRONMENT="${{ github.event.inputs.environment }}"
          
          # 統合テスト実行
          npm test
        else
          echo "⚠️ 統合テストディレクトリが見つかりません。基本的な疎通確認を実行します。"
          
          # 基本的な疎通確認
          API_URL="${{ steps.get-urls.outputs.api-url }}"
          FRONTEND_URL="${{ steps.get-urls.outputs.vercel-url }}"
          
          echo "API URL: $API_URL"
          echo "Frontend URL: $FRONTEND_URL"
          
          # フロントエンドの疎通確認
          if curl -f -s "$FRONTEND_URL" > /dev/null; then
            echo "✅ フロントエンド疎通確認成功"
          else
            echo "❌ フロントエンド疎通確認失敗"
            exit 1
          fi
          
          # APIの疎通確認（認証エラーが期待される）
          if curl -f -s "$API_URL" > /dev/null || curl -s "$API_URL" | grep -q "error\|unauthorized\|forbidden"; then
            echo "✅ API疎通確認成功（認証エラーまたは正常レスポンス）"
          else
            echo "❌ API疎通確認失敗"
            exit 1
          fi
        fi

    - name: Test Summary
      if: always()
      run: |
        echo "## 🧪 統合テスト結果" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **環境**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- **フロントエンド**: ${{ steps.get-urls.outputs.vercel-url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **バックエンド**: ${{ steps.get-urls.outputs.api-url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **テスト実行時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # Step 4: デプロイ完了通知
  deployment-complete:
    name: Deployment Complete
    needs: [deploy-aws, deploy-vercel, integration-test]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Deployment Summary
      run: |
        echo "## 🎉 フルスタックデプロイ完了" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### デプロイ結果" >> $GITHUB_STEP_SUMMARY
        echo "- **AWS**: ${{ needs.deploy-aws.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Vercel**: ${{ needs.deploy-vercel.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **統合テスト**: ${{ needs.integration-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 環境情報" >> $GITHUB_STEP_SUMMARY
        echo "- **環境**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- **デプロイ時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.deploy-aws.result }}" == "success" && "${{ needs.deploy-vercel.result }}" == "success" ]]; then
          echo "✅ **デプロイ成功** - アプリケーションが利用可能です" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **デプロイ失敗** - ログを確認してください" >> $GITHUB_STEP_SUMMARY
        fi