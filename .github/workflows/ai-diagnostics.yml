name: 🔎 AI Diagnostics (01–04)

on:
  workflow_call:
    inputs:
      run_js:
        description: 'JS/TS系診断を実行するか'
        required: false
        default: true
        type: boolean
      run_py:
        description: 'Python系診断を実行するか'
        required: false
        default: true
        type: boolean
      node_version:
        description: 'Node.jsバージョン'
        required: false
        default: '20'
        type: string
      python_version:
        description: 'Pythonバージョン'
        required: false
        default: '3.11'
        type: string

permissions:
  contents: read
  actions: read
  security-events: read

jobs:
  js-quick-fail:
    name: 🧨 01/JS - 最初の失敗トレース
    runs-on: ubuntu-latest
    if: ${{ inputs.run_js && hashFiles('frontend/package*.json') != '' }}
    continue-on-error: true
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci
        continue-on-error: true

      - name: 📁 Create analysis directories
        run: |
          mkdir -p ../analysis_data/logs
          echo "## 🧨 01/JS: 失敗テストの先頭1件" >> $GITHUB_STEP_SUMMARY

      - name: 🧨 Run Vitest with bail (first failure)
        run: |
          echo "::group::🔍 Vitest実行ログ"
          if [ -f "vitest.config.ts" ] || [ -f "vitest.config.js" ]; then
            NODE_OPTIONS=--enable-source-maps npx vitest run --bail 1 --reporter=json > ../analysis_data/logs/vitest-first.json 2>&1 || true
            echo "Vitest結果を保存しました: analysis_data/logs/vitest-first.json"
          else
            echo "Vitestが見つかりません。Jestを確認中..."
          fi
          echo "::endgroup::"

      - name: 🧨 Run Jest with bail (first failure)
        if: ${{ !hashFiles('frontend/vitest.config.*') }}
        run: |
          echo "::group::🔍 Jest実行ログ"
          if [ -f "jest.config.js" ] || [ -f "jest.config.ts" ] || grep -q '"jest"' package.json; then
            NODE_OPTIONS=--enable-source-maps npx jest --bail --json --outputFile=../analysis_data/logs/jest-first.json || true
            echo "Jest結果を保存しました: analysis_data/logs/jest-first.json"
          else
            echo "JestもVitestも見つかりません。スキップします。"
            echo '{"testResults": [], "numFailedTests": 0, "message": "No test framework found"}' > ../analysis_data/logs/jest-first.json
          fi
          echo "::endgroup::"

      - name: 📊 Parse test results for summary
        run: |
          echo "::group::📊 テスト結果解析"
          
          # Vitest結果の解析
          if [ -f "../analysis_data/logs/vitest-first.json" ] && [ -s "../analysis_data/logs/vitest-first.json" ]; then
            echo "| ファイル | 行 | エラー |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|----|---------| " >> $GITHUB_STEP_SUMMARY
            
            # JSONから失敗情報を抽出（簡易版）
            if grep -q '"numFailedTests"' ../analysis_data/logs/vitest-first.json; then
              echo "| テスト失敗 | - | 詳細はログを確認 |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| テスト成功 | - | 失敗なし |" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          # Jest結果の解析
          if [ -f "../analysis_data/logs/jest-first.json" ] && [ -s "../analysis_data/logs/jest-first.json" ]; then
            echo "| ファイル | 行 | エラー |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|----|---------| " >> $GITHUB_STEP_SUMMARY
            
            # JSONから失敗情報を抽出（簡易版）
            if grep -q '"numFailedTests": 0' ../analysis_data/logs/jest-first.json; then
              echo "| テスト成功 | - | 失敗なし |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| テスト失敗 | - | 詳細はログを確認 |" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "::endgroup::"

  py-quick-fail:
    name: 🐍 01/Py - 最初の失敗トレース
    runs-on: ubuntu-latest
    if: ${{ inputs.run_py && hashFiles('backend/src/requirements.txt') != '' }}
    continue-on-error: true
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ inputs.python_version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python_version }}

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install pytest
        continue-on-error: true

      - name: 📁 Create analysis directories
        run: |
          mkdir -p ../analysis_data/logs
          echo "## 🐍 01/Py: 失敗テストの先頭1件" >> $GITHUB_STEP_SUMMARY

      - name: 🐍 Run pytest with maxfail=1 (first failure)
        run: |
          echo "::group::🔍 pytest実行ログ"
          PYTHONFAULTHANDLER=1 pytest -x --maxfail=1 -vv --tb=long | tee ../analysis_data/logs/pytest-first.txt || true
          echo "pytest結果を保存しました: analysis_data/logs/pytest-first.txt"
          echo "::endgroup::"
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing

      - name: 📊 Parse pytest results for summary
        run: |
          echo "::group::📊 pytest結果解析"
          
          if [ -f "../analysis_data/logs/pytest-first.txt" ]; then
            echo "| ファイル | 行 | エラー |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|----|---------| " >> $GITHUB_STEP_SUMMARY
            
            # pytest結果から失敗情報を抽出
            if grep -q "FAILED" ../analysis_data/logs/pytest-first.txt; then
              FAILED_LINE=$(grep "FAILED" ../analysis_data/logs/pytest-first.txt | head -1)
              echo "| pytest失敗 | - | $FAILED_LINE |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| pytest成功 | - | 失敗なし |" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "::endgroup::"

  next-api-smoke:
    name: 🔥 02/JS - Next.js APIスモークテスト
    runs-on: ubuntu-latest
    if: ${{ inputs.run_js && hashFiles('frontend/src/app/**/route.*') != '' }}
    continue-on-error: true
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci
        continue-on-error: true

      - name: 📁 Create analysis directories
        run: |
          mkdir -p ../analysis_data/logs
          echo "## 🔥 02/JS: Next.js APIハンドラスモークテスト" >> $GITHUB_STEP_SUMMARY

      - name: 🔥 Run Next.js API smoke tests
        run: |
          echo "::group::🔍 APIスモークテスト実行"
          
          # Next.js APIルートを検索
          find src/app -name "route.ts" -o -name "route.js" | while read route_file; do
            echo "Testing: $route_file"
            
            # 簡易的なスモークテスト（実際のimportは複雑なので、ファイル存在確認）
            if [ -f "$route_file" ]; then
              if grep -q "export.*GET\|export.*POST\|export.*PUT\|export.*DELETE" "$route_file"; then
                echo "SMOKE_OK $route_file - HTTP handlers found" | tee -a ../analysis_data/logs/next-smoke.txt
              else
                echo "SMOKE_FAIL $route_file - No HTTP handlers found" | tee -a ../analysis_data/logs/next-smoke.txt
              fi
            else
              echo "SMOKE_FAIL $route_file - File not found" | tee -a ../analysis_data/logs/next-smoke.txt
            fi
          done
          
          # 結果がない場合のデフォルト
          if [ ! -f "../analysis_data/logs/next-smoke.txt" ]; then
            echo "SMOKE_INFO - No Next.js API routes found" > ../analysis_data/logs/next-smoke.txt
          fi
          
          echo "::endgroup::"

      - name: 📊 Parse smoke test results
        run: |
          echo "::group::📊 スモークテスト結果"
          
          if [ -f "../analysis_data/logs/next-smoke.txt" ]; then
            echo "| APIルート | 状態 | 詳細 |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|------|------| " >> $GITHUB_STEP_SUMMARY
            
            while IFS= read -r line; do
              if [[ $line == SMOKE_OK* ]]; then
                echo "| ✅ | OK | ${line#SMOKE_OK } |" >> $GITHUB_STEP_SUMMARY
              elif [[ $line == SMOKE_FAIL* ]]; then
                echo "| ❌ | FAIL | ${line#SMOKE_FAIL } |" >> $GITHUB_STEP_SUMMARY
              fi
            done < ../analysis_data/logs/next-smoke.txt
          fi
          
          echo "::endgroup::"

  py-import-smoke:
    name: 🔥 02/Py - Pythonインポートスモークテスト
    runs-on: ubuntu-latest
    if: ${{ inputs.run_py && hashFiles('backend/src/**/*.py') != '' }}
    continue-on-error: true
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ inputs.python_version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python_version }}

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
        continue-on-error: true

      - name: 📁 Create analysis directories
        run: |
          mkdir -p ../analysis_data/logs
          echo "## 🔥 02/Py: Pythonインポートスモークテスト" >> $GITHUB_STEP_SUMMARY

      - name: 🔥 Run Python import smoke tests
        run: |
          echo "::group::🔍 Pythonインポートテスト実行"
          
          # Pythonファイルを検索してimportテスト
          find src -name "*.py" -not -name "test_*" | while read py_file; do
            # ファイルパスをモジュール名に変換
            module_name=$(echo "$py_file" | sed 's|/|.|g' | sed 's|\.py$||')
            
            echo "Testing import: $module_name"
            
            # Pythonでimportテスト（タイムアウト付き）
            timeout 2s python -c "
try:
    import sys
    sys.path.insert(0, '.')
    import $module_name
    print('SMOKE_OK $module_name - Import successful')
except Exception as e:
    print(f'SMOKE_FAIL $module_name - {str(e)}')
" 2>&1 | tee -a ../analysis_data/logs/py-import-smoke.txt || echo "SMOKE_FAIL $module_name - Timeout or error" | tee -a ../analysis_data/logs/py-import-smoke.txt
          done
          
          # 結果がない場合のデフォルト
          if [ ! -f "../analysis_data/logs/py-import-smoke.txt" ]; then
            echo "SMOKE_INFO - No Python modules found" > ../analysis_data/logs/py-import-smoke.txt
          fi
          
          echo "::endgroup::"

      - name: 📊 Parse import test results
        run: |
          echo "::group::📊 インポートテスト結果"
          
          if [ -f "../analysis_data/logs/py-import-smoke.txt" ]; then
            echo "| モジュール | 状態 | 詳細 |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|------|------| " >> $GITHUB_STEP_SUMMARY
            
            while IFS= read -r line; do
              if [[ $line == SMOKE_OK* ]]; then
                echo "| ✅ | OK | ${line#SMOKE_OK } |" >> $GITHUB_STEP_SUMMARY
              elif [[ $line == SMOKE_FAIL* ]]; then
                echo "| ❌ | FAIL | ${line#SMOKE_FAIL } |" >> $GITHUB_STEP_SUMMARY
              fi
            done < ../analysis_data/logs/py-import-smoke.txt
          fi
          
          echo "::endgroup::"

  coverage-js:
    name: 📊 03/JS - 限定カバレッジ
    runs-on: ubuntu-latest
    if: ${{ inputs.run_js && hashFiles('frontend/package*.json') != '' }}
    continue-on-error: true
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci
        continue-on-error: true

      - name: 📁 Create analysis directories
        run: |
          mkdir -p ../analysis_data/coverage
          echo "## 📊 03/JS: 限定カバレッジ（最初の失敗まで）" >> $GITHUB_STEP_SUMMARY

      - name: 📊 Run coverage with bail (first failure)
        run: |
          echo "::group::🔍 カバレッジ実行"
          
          if [ -f "vitest.config.ts" ] || [ -f "vitest.config.js" ]; then
            # Vitest coverage
            npx vitest run --bail 1 --coverage.enabled --coverage.reporter=json --coverage.reportsDirectory=../analysis_data/coverage || true
            if [ -f "../analysis_data/coverage/coverage-final.json" ]; then
              cp ../analysis_data/coverage/coverage-final.json ../analysis_data/coverage/js-coverage.json
            fi
          elif grep -q '"jest"' package.json; then
            # Jest coverage
            npx jest --bail --coverage --coverageReporters=json --coverageDirectory=../analysis_data/coverage || true
            if [ -f "../analysis_data/coverage/coverage-final.json" ]; then
              cp ../analysis_data/coverage/coverage-final.json ../analysis_data/coverage/js-coverage.json
            fi
          else
            echo '{"message": "No test framework found for coverage"}' > ../analysis_data/coverage/js-coverage.json
          fi
          
          echo "::endgroup::"

      - name: 📊 Parse coverage results
        run: |
          echo "::group::📊 カバレッジ結果"
          
          if [ -f "../analysis_data/coverage/js-coverage.json" ]; then
            echo "✅ JSカバレッジファイルを生成しました" >> $GITHUB_STEP_SUMMARY
            
            # 簡易的なカバレッジ情報表示
            if grep -q '"total"' ../analysis_data/coverage/js-coverage.json; then
              echo "📊 カバレッジデータが利用可能です" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ カバレッジファイルの生成に失敗しました" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "::endgroup::"

  coverage-py:
    name: 📊 03/Py - 限定カバレッジ
    runs-on: ubuntu-latest
    if: ${{ inputs.run_py && hashFiles('backend/src/requirements.txt') != '' }}
    continue-on-error: true
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ inputs.python_version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python_version }}

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install pytest coverage
        continue-on-error: true

      - name: 📁 Create analysis directories
        run: |
          mkdir -p ../analysis_data/coverage
          echo "## 📊 03/Py: 限定カバレッジ（最初の失敗まで）" >> $GITHUB_STEP_SUMMARY

      - name: 📊 Run coverage with maxfail=1 (first failure)
        run: |
          echo "::group::🔍 Pythonカバレッジ実行"
          
          coverage run -m pytest -x --maxfail=1 || true
          coverage json -o ../analysis_data/coverage/py-coverage.json || true
          
          echo "::endgroup::"
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing

      - name: 📊 Parse coverage results
        run: |
          echo "::group::📊 Pythonカバレッジ結果"
          
          if [ -f "../analysis_data/coverage/py-coverage.json" ]; then
            echo "✅ Pythonカバレッジファイルを生成しました" >> $GITHUB_STEP_SUMMARY
            
            # 簡易的なカバレッジ情報表示
            if grep -q '"totals"' ../analysis_data/coverage/py-coverage.json; then
              echo "📊 カバレッジデータが利用可能です" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ カバレッジファイルの生成に失敗しました" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "::endgroup::"

  rank-suspects:
    name: 🎯 04 - 統合ランキング
    runs-on: ubuntu-latest
    needs: [js-quick-fail, py-quick-fail, next-api-smoke, py-import-smoke, coverage-js, coverage-py]
    if: always()
    continue-on-error: true

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ inputs.python_version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python_version }}

      - name: 📁 Create analysis directories
        run: |
          mkdir -p analysis_data/logs analysis_data/coverage
          echo "## 🎯 04: 統合ランキング（問題箇所特定）" >> $GITHUB_STEP_SUMMARY

      - name: 📥 Download artifacts from ai-artifacts job
        uses: actions/download-artifact@v4
        with:
          name: ai-analysis-package
          path: ./
        continue-on-error: true

      - name: 🎯 Generate suspects ranking
        run: |
          echo "::group::🔍 統合ランキング生成"
          python3 .github/scripts/rank_suspects.py
          echo "::endgroup::"

      - name: 📊 Update GitHub Step Summary with ranking
        run: |
          echo "::group::📊 ランキング結果をSummaryに追加"
          
          if [ -f "analysis_data/suspects.json" ]; then
            echo "## 🎯 問題箇所ランキング（上位5件）" >> $GITHUB_STEP_SUMMARY
            echo "| 順位 | ファイル | 行 | スコア |" >> $GITHUB_STEP_SUMMARY
            echo "|------|----------|----|---------| " >> $GITHUB_STEP_SUMMARY
            python3 .github/scripts/update_summary.py >> $GITHUB_STEP_SUMMARY
          else
            echo "| - | ランキングデータなし | - | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "::endgroup::"

  publish:
    name: 📦 アーティファクト公開
    runs-on: ubuntu-latest
    needs: [js-quick-fail, py-quick-fail, next-api-smoke, py-import-smoke, coverage-js, coverage-py, rank-suspects]
    if: always()

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📁 Create analysis directories
        run: |
          mkdir -p analysis_data/logs analysis_data/coverage
          echo "## 📦 診断アーティファクト公開" >> $GITHUB_STEP_SUMMARY

      - name: 📦 Upload AI diagnostics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-diagnostics
          path: |
            analysis_data/logs/
            analysis_data/coverage/
            analysis_data/suspects.json
          retention-days: 7
          if-no-files-found: warn

      - name: 📊 Final summary
        run: |
          echo "✅ AI診断アーティファクトを公開しました" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 生成されたファイル" >> $GITHUB_STEP_SUMMARY
          echo "- 🧨 analysis_data/logs/ - テスト失敗ログとスモークテスト結果" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 analysis_data/coverage/ - 限定カバレッジデータ" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 analysis_data/suspects.json - 問題箇所ランキング" >> $GITHUB_STEP_SUMMARY