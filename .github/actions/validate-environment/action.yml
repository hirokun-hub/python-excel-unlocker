name: 'Validate CI Environment'
description: 'CI/CD環境の設定検証とレポート生成'

inputs:
  validation-type:
    description: '検証タイプ（full/aws/vercel/basic）'
    required: false
    default: 'basic'
  fail-on-error:
    description: '必須項目の失敗時にワークフローを停止するか'
    required: false
    default: 'true'
  generate-report:
    description: 'GitHub Actions Summary用レポートを生成するか'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Python環境セットアップ
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 環境変数検証実行
      id: validation
      shell: bash
      run: |
        echo "🔍 CI/CD環境設定の検証を開始します..."
        
        # 検証スクリプト実行
        python scripts/validate-ci-environment.py
        VALIDATION_EXIT_CODE=$?
        
        echo "validation_success=$([ $VALIDATION_EXIT_CODE -eq 0 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
        echo "validation_exit_code=$VALIDATION_EXIT_CODE" >> $GITHUB_OUTPUT

    - name: 検証レポート生成
      if: inputs.generate-report == 'true'
      shell: bash
      run: |
        echo "## 🔍 CI/CD環境設定検証レポート" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 検証情報" >> $GITHUB_STEP_SUMMARY
        echo "- **検証タイプ**: ${{ inputs.validation-type }}" >> $GITHUB_STEP_SUMMARY
        echo "- **検証時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "- **実行者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **リポジトリ**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # JSON結果ファイルが存在する場合は詳細レポート生成
        if [ -f "ci-validation-summary.json" ]; then
          echo "### 📊 検証結果サマリー" >> $GITHUB_STEP_SUMMARY
          
          # JSONから結果を抽出してMarkdownテーブル生成
          python3 << 'EOF'
import json
import os

try:
    with open('ci-validation-summary.json', 'r') as f:
        data = json.load(f)
    
    # サマリー情報
    total = data['total']
    passed = data['passed']
    failed = data['failed']
    
    with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
        f.write(f"- **総検証項目**: {total}\n")
        f.write(f"- **✅ 成功**: {passed}\n")
        f.write(f"- **❌ 失敗**: {failed}\n")
        f.write(f"- **成功率**: {passed/total*100:.1f}%\n")
        f.write("\n")
        
        # レベル別結果
        f.write("| レベル | 成功 | 失敗 | 合計 |\n")
        f.write("|--------|------|------|------|\n")
        
        level_names = {"required": "🔴 必須", "recommended": "🟡 推奨", "optional": "🔵 オプション"}
        for level, level_data in data['by_level'].items():
            if level_data['total'] > 0:
                name = level_names.get(level, level)
                f.write(f"| {name} | {level_data['passed']} | {level_data['failed']} | {level_data['total']} |\n")
        
        f.write("\n")
        
        # 重要な失敗項目
        if data['critical_failures']:
            f.write("### 🚨 重要な問題（必須項目の失敗）\n\n")
            for failure in data['critical_failures']:
                f.write(f"#### ❌ {failure['name']}\n")
                f.write(f"**問題**: {failure['message']}\n\n")
                if failure.get('suggestion'):
                    f.write(f"**対処法**: {failure['suggestion']}\n\n")
        
        # 全体判定
        f.write("### 📋 総合判定\n\n")
        if data['by_level']['required']['failed'] == 0:
            f.write("✅ **検証成功** - 必須項目は全て設定されています。CI/CDパイプラインが正常に動作するはずです。\n\n")
        else:
            f.write("❌ **検証失敗** - 必須項目に不備があります。CI/CDパイプラインが正常に動作しない可能性があります。\n\n")
            f.write("上記の「重要な問題」を解決してから再実行してください。\n\n")

except Exception as e:
    print(f"レポート生成エラー: {e}")
EOF
        else
          echo "⚠️ 検証結果ファイルが見つかりません。詳細ログを確認してください。" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📚 参考資料" >> $GITHUB_STEP_SUMMARY
        echo "- [GitHub Secrets設定ガイド](https://github.com/${{ github.repository }}/blob/main/docs/github-secrets-setup-guide.md)" >> $GITHUB_STEP_SUMMARY
        echo "- [統合セットアップガイド](https://github.com/${{ github.repository }}/blob/main/docs/integrated-setup-guide.md)" >> $GITHUB_STEP_SUMMARY
        echo "- [デプロイガイド](https://github.com/${{ github.repository }}/blob/main/docs/deployment-guide.md)" >> $GITHUB_STEP_SUMMARY

    - name: 検証結果アーティファクト保存
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-validation-report-${{ github.run_id }}
        path: |
          ci-validation-summary.json
        retention-days: 30

    - name: 検証失敗時の処理
      if: steps.validation.outputs.validation_success != 'true' && inputs.fail-on-error == 'true'
      shell: bash
      run: |
        echo "❌ CI/CD環境設定の検証に失敗しました。"
        echo "必須項目の設定を確認してください。"
        echo "詳細は上記のレポートを参照してください。"
        exit 1

    - name: 検証成功時の処理
      if: steps.validation.outputs.validation_success == 'true'
      shell: bash
      run: |
        echo "✅ CI/CD環境設定の検証に成功しました。"
        echo "ワークフローを続行します。"