name: 'Unified Error Handler'
description: 'CI/CDワークフローの統一エラーハンドリングとガイダンス生成'

inputs:
  workflow-name:
    description: 'ワークフロー名（エラー分類用）'
    required: true
  step-name:
    description: '現在のステップ名'
    required: true
  error-category:
    description: 'エラーカテゴリ（backend/frontend/test/deployment）'
    required: false
    default: 'general'
  environment:
    description: 'デプロイ環境'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: エラー情報収集
      if: failure()
      shell: bash
      run: |
        echo "ERROR_WORKFLOW=${{ inputs.workflow-name }}" >> $GITHUB_ENV
        echo "ERROR_STEP=${{ inputs.step-name }}" >> $GITHUB_ENV
        echo "ERROR_CATEGORY=${{ inputs.error-category }}" >> $GITHUB_ENV
        echo "ERROR_ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "ERROR_TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

    - name: 統一エラーメッセージ生成
      if: failure()
      shell: bash
      run: |
        echo "## 🚨 エラーが発生しました" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### エラー詳細" >> $GITHUB_STEP_SUMMARY
        echo "- **ワークフロー**: ${{ inputs.workflow-name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **失敗ステップ**: ${{ inputs.step-name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **カテゴリ**: ${{ inputs.error-category }}" >> $GITHUB_STEP_SUMMARY
        echo "- **環境**: ${{ inputs.environment || '指定なし' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **発生時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "- **実行ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: カテゴリ別対処法生成
      if: failure()
      shell: bash
      run: |
        case "${{ inputs.error-category }}" in
          "backend"|"aws")
            echo "### 🔧 バックエンドエラー対処法" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 即座に試せる対処法" >> $GITHUB_STEP_SUMMARY
            echo "1. **ローカルテスト実行**" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "   cd backend && pytest tests/unit/" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "2. **AWS認証確認**" >> $GITHUB_STEP_SUMMARY
            echo "   - GitHub OIDC: Repository Settings → Secrets → \`AWS_GITHUB_ACTIONS_ROLE_ARN\`" >> $GITHUB_STEP_SUMMARY
            echo "   - アクセスキー: \`AWS_ACCESS_KEY_ID\`, \`AWS_SECRET_ACCESS_KEY\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "3. **SAM設定確認**" >> $GITHUB_STEP_SUMMARY
            echo "   - \`samconfig.toml\` の環境設定確認" >> $GITHUB_STEP_SUMMARY
            echo "   - \`template.yaml\` の構文確認" >> $GITHUB_STEP_SUMMARY
            ;;
          "frontend"|"vercel")
            echo "### 🎨 フロントエンドエラー対処法" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 即座に試せる対処法" >> $GITHUB_STEP_SUMMARY
            echo "1. **ローカル検証実行**" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "   cd frontend" >> $GITHUB_STEP_SUMMARY
            echo "   npm run lint && npm run type-check && npm run test" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "2. **Vercel認証確認**" >> $GITHUB_STEP_SUMMARY
            echo "   - Repository Settings → Secrets → \`VERCEL_TOKEN\`" >> $GITHUB_STEP_SUMMARY
            echo "   - \`VERCEL_ORG_ID\`, \`VERCEL_PROJECT_ID\` の設定確認" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "3. **ビルド設定確認**" >> $GITHUB_STEP_SUMMARY
            echo "   - \`next.config.ts\` の設定確認" >> $GITHUB_STEP_SUMMARY
            echo "   - 環境変数 \`NEXT_PUBLIC_API_URL\` の設定確認" >> $GITHUB_STEP_SUMMARY
            ;;
          "test"|"e2e")
            echo "### 🧪 テストエラー対処法" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 即座に試せる対処法" >> $GITHUB_STEP_SUMMARY
            echo "1. **ローカルテスト実行**" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "   cd frontend && npm run test:e2e" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "2. **デプロイ状態確認**" >> $GITHUB_STEP_SUMMARY
            echo "   - フロントエンドURL: アクセス可能性確認" >> $GITHUB_STEP_SUMMARY
            echo "   - APIエンドポイント: 応答確認" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "3. **認証設定確認**" >> $GITHUB_STEP_SUMMARY
            echo "   - Google OAuth設定の確認" >> $GITHUB_STEP_SUMMARY
            echo "   - テストユーザーの許可リスト確認" >> $GITHUB_STEP_SUMMARY
            ;;
          "deployment")
            echo "### 🚀 デプロイメントエラー対処法" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 即座に試せる対処法" >> $GITHUB_STEP_SUMMARY
            echo "1. **権限確認**" >> $GITHUB_STEP_SUMMARY
            echo "   - AWS IAMロール・ポリシーの確認" >> $GITHUB_STEP_SUMMARY
            echo "   - Vercelプロジェクト権限の確認" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "2. **リソース状態確認**" >> $GITHUB_STEP_SUMMARY
            echo "   - AWS CloudFormationスタック状態" >> $GITHUB_STEP_SUMMARY
            echo "   - Vercelプロジェクト状態" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "3. **設定ファイル確認**" >> $GITHUB_STEP_SUMMARY
            echo "   - \`samconfig.toml\` の環境別設定" >> $GITHUB_STEP_SUMMARY
            echo "   - \`vercel.json\` の設定確認" >> $GITHUB_STEP_SUMMARY
            ;;
          *)
            echo "### 🔍 一般的なエラー対処法" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 即座に試せる対処法" >> $GITHUB_STEP_SUMMARY
            echo "1. **ログ詳細確認**: 失敗したステップのログを詳細確認" >> $GITHUB_STEP_SUMMARY
            echo "2. **環境変数確認**: GitHub Secrets・環境変数の設定確認" >> $GITHUB_STEP_SUMMARY
            echo "3. **依存関係確認**: package.json, requirements.txt の整合性" >> $GITHUB_STEP_SUMMARY
            echo "4. **権限確認**: GitHub Actions の実行権限確認" >> $GITHUB_STEP_SUMMARY
            ;;
        esac

    - name: 参考資料とサポート情報
      if: failure()
      shell: bash
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📚 参考資料" >> $GITHUB_STEP_SUMMARY
        echo "| 資料 | 用途 |" >> $GITHUB_STEP_SUMMARY
        echo "|------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| [デプロイガイド](https://github.com/${{ github.repository }}/blob/main/docs/deployment-guide.md) | 基本的なデプロイ手順 |" >> $GITHUB_STEP_SUMMARY
        echo "| [トラブルシューティング](https://github.com/${{ github.repository }}/blob/main/docs/troubleshooting-diagnostic-guide.md) | 問題解決手順 |" >> $GITHUB_STEP_SUMMARY
        echo "| [GitHub Secrets設定](https://github.com/${{ github.repository }}/blob/main/docs/github-secrets-setup-guide.md) | 認証設定手順 |" >> $GITHUB_STEP_SUMMARY
        echo "| [統合セットアップ](https://github.com/${{ github.repository }}/blob/main/docs/integrated-setup-guide.md) | 初期セットアップ |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🆘 サポート情報" >> $GITHUB_STEP_SUMMARY
        echo "問題が解決しない場合は、以下の情報と共にIssueを作成してください：" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "ワークフロー: ${{ inputs.workflow-name }}" >> $GITHUB_STEP_SUMMARY
        echo "失敗ステップ: ${{ inputs.step-name }}" >> $GITHUB_STEP_SUMMARY
        echo "カテゴリ: ${{ inputs.error-category }}" >> $GITHUB_STEP_SUMMARY
        echo "環境: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "実行ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
        echo "コミット: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "実行者: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "発生時刻: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: エラーアーティファクト準備
      if: failure()
      shell: bash
      run: |
        mkdir -p error-debug-info
        
        # エラー情報をファイルに保存
        cat > error-debug-info/error-summary.json << EOF
        {
          "workflow": "${{ inputs.workflow-name }}",
          "step": "${{ inputs.step-name }}",
          "category": "${{ inputs.error-category }}",
          "environment": "${{ inputs.environment }}",
          "timestamp": "$(date -u '+%Y-%m-%d %H:%M:%S UTC')",
          "run_id": "${{ github.run_id }}",
          "commit": "${{ github.sha }}",
          "actor": "${{ github.actor }}",
          "repository": "${{ github.repository }}"
        }
        EOF
        
        # 環境情報を収集
        echo "=== System Information ===" > error-debug-info/system-info.txt
        echo "Runner OS: ${{ runner.os }}" >> error-debug-info/system-info.txt
        echo "Node Version: $(node --version 2>/dev/null || echo 'N/A')" >> error-debug-info/system-info.txt
        echo "Python Version: $(python --version 2>/dev/null || echo 'N/A')" >> error-debug-info/system-info.txt
        echo "Git Commit: ${{ github.sha }}" >> error-debug-info/system-info.txt
        echo "Git Ref: ${{ github.ref }}" >> error-debug-info/system-info.txt
        echo "" >> error-debug-info/system-info.txt
        echo "=== Environment Variables ===" >> error-debug-info/system-info.txt
        env | grep -E '^(GITHUB_|RUNNER_|NODE_|NPM_)' | sort >> error-debug-info/system-info.txt

    - name: エラーアーティファクトアップロード
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-debug-${{ inputs.workflow-name }}-${{ github.run_id }}
        path: error-debug-info/
        retention-days: 30