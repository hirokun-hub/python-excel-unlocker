name: 'Test Artifact Collector'
description: 'テスト失敗時のアーティファクト自動収集'

inputs:
  test-type:
    description: 'テストタイプ（unit/e2e/integration）'
    required: true
  working-directory:
    description: 'テスト実行ディレクトリ'
    required: false
    default: '.'
  collect-screenshots:
    description: 'スクリーンショットを収集するか'
    required: false
    default: 'false'
  collect-logs:
    description: 'ログファイルを収集するか'
    required: false
    default: 'true'
  collect-coverage:
    description: 'カバレッジレポートを収集するか'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: テスト失敗アーティファクト収集準備
      if: failure()
      shell: bash
      run: |
        echo "テスト失敗を検出しました。アーティファクトを収集します..."
        mkdir -p test-failure-artifacts/${{ inputs.test-type }}
        
        # 基本情報を記録
        cat > test-failure-artifacts/${{ inputs.test-type }}/failure-info.txt << EOF
        Test Type: ${{ inputs.test-type }}
        Working Directory: ${{ inputs.working-directory }}
        Failure Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        Runner OS: ${{ runner.os }}
        GitHub Run ID: ${{ github.run_id }}
        GitHub SHA: ${{ github.sha }}
        GitHub Actor: ${{ github.actor }}
        EOF

    - name: 単体テスト失敗アーティファクト収集
      if: failure() && inputs.test-type == 'unit'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "単体テスト失敗アーティファクトを収集中..."
        
        # Jest/pytest出力ファイルを収集
        if [ -f "coverage/lcov.info" ]; then
          cp -r coverage/ ../test-failure-artifacts/${{ inputs.test-type }}/coverage/ || true
        fi
        
        if [ -f "coverage.xml" ]; then
          cp coverage.xml ../test-failure-artifacts/${{ inputs.test-type }}/ || true
        fi
        
        # テスト結果ファイルを収集
        find . -name "*.xml" -path "*/test-results/*" -exec cp {} ../test-failure-artifacts/${{ inputs.test-type }}/ \; || true
        find . -name "junit*.xml" -exec cp {} ../test-failure-artifacts/${{ inputs.test-type }}/ \; || true
        
        # ログファイルを収集
        if [ "${{ inputs.collect-logs }}" = "true" ]; then
          find . -name "*.log" -exec cp {} ../test-failure-artifacts/${{ inputs.test-type }}/ \; || true
          find . -name "npm-debug.log*" -exec cp {} ../test-failure-artifacts/${{ inputs.test-type }}/ \; || true
        fi
        
        # package.json と lock ファイルを収集（依存関係確認用）
        [ -f "package.json" ] && cp package.json ../test-failure-artifacts/${{ inputs.test-type }}/ || true
        [ -f "package-lock.json" ] && cp package-lock.json ../test-failure-artifacts/${{ inputs.test-type }}/ || true
        [ -f "requirements.txt" ] && cp requirements.txt ../test-failure-artifacts/${{ inputs.test-type }}/ || true

    - name: E2Eテスト失敗アーティファクト収集
      if: failure() && inputs.test-type == 'e2e'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "E2Eテスト失敗アーティファクトを収集中..."
        
        # Playwrightスクリーンショットとビデオを収集
        if [ "${{ inputs.collect-screenshots }}" = "true" ]; then
          if [ -d "test-results" ]; then
            cp -r test-results/ ../test-failure-artifacts/${{ inputs.test-type }}/playwright-results/ || true
          fi
          
          if [ -d "playwright-report" ]; then
            cp -r playwright-report/ ../test-failure-artifacts/${{ inputs.test-type }}/ || true
          fi
        fi
        
        # E2Eテスト設定ファイルを収集
        [ -f "playwright.config.ts" ] && cp playwright.config.ts ../test-failure-artifacts/${{ inputs.test-type }}/ || true
        [ -f "playwright.config.js" ] && cp playwright.config.js ../test-failure-artifacts/${{ inputs.test-type }}/ || true
        
        # ブラウザログを収集
        find . -name "*.log" -path "*/test-results/*" -exec cp {} ../test-failure-artifacts/${{ inputs.test-type }}/ \; || true

    - name: 統合テスト失敗アーティファクト収集
      if: failure() && inputs.test-type == 'integration'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "統合テスト失敗アーティファクトを収集中..."
        
        # 統合テスト結果を収集
        find . -name "integration-test-*.xml" -exec cp {} ../test-failure-artifacts/${{ inputs.test-type }}/ \; || true
        find . -name "integration-*.log" -exec cp {} ../test-failure-artifacts/${{ inputs.test-type }}/ \; || true
        
        # API応答ログを収集
        find . -name "api-*.log" -exec cp {} ../test-failure-artifacts/${{ inputs.test-type }}/ \; || true
        find . -name "curl-*.log" -exec cp {} ../test-failure-artifacts/${{ inputs.test-type }}/ \; || true

    - name: 環境情報収集
      if: failure()
      shell: bash
      run: |
        echo "環境情報を収集中..."
        
        # システム情報
        cat > test-failure-artifacts/${{ inputs.test-type }}/system-info.txt << EOF
        === System Information ===
        OS: ${{ runner.os }}
        Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        
        === Node.js Information ===
        Node Version: $(node --version 2>/dev/null || echo 'N/A')
        NPM Version: $(npm --version 2>/dev/null || echo 'N/A')
        
        === Python Information ===
        Python Version: $(python --version 2>/dev/null || echo 'N/A')
        Pip Version: $(pip --version 2>/dev/null || echo 'N/A')
        
        === Git Information ===
        Commit: ${{ github.sha }}
        Ref: ${{ github.ref }}
        Repository: ${{ github.repository }}
        
        === Environment Variables ===
        EOF
        
        # 安全な環境変数のみを出力
        env | grep -E '^(NODE_|NPM_|GITHUB_|RUNNER_|CI)' | sort >> test-failure-artifacts/${{ inputs.test-type }}/system-info.txt || true

    - name: 依存関係情報収集
      if: failure()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "依存関係情報を収集中..."
        
        # Node.js依存関係
        if [ -f "package.json" ]; then
          echo "=== NPM Dependencies ===" > ../test-failure-artifacts/${{ inputs.test-type }}/dependencies.txt
          npm list --depth=0 >> ../test-failure-artifacts/${{ inputs.test-type }}/dependencies.txt 2>&1 || true
          echo "" >> ../test-failure-artifacts/${{ inputs.test-type }}/dependencies.txt
        fi
        
        # Python依存関係
        if [ -f "requirements.txt" ]; then
          echo "=== Python Dependencies ===" >> ../test-failure-artifacts/${{ inputs.test-type }}/dependencies.txt
          pip list >> ../test-failure-artifacts/${{ inputs.test-type }}/dependencies.txt 2>&1 || true
        fi

    - name: テスト失敗アーティファクトアップロード
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-failure-${{ inputs.test-type }}-${{ github.run_id }}
        path: test-failure-artifacts/${{ inputs.test-type }}/
        retention-days: 30

    - name: テスト失敗サマリー生成
      if: failure()
      shell: bash
      run: |
        echo "## 🧪 テスト失敗アーティファクト収集完了" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 収集情報" >> $GITHUB_STEP_SUMMARY
        echo "- **テストタイプ**: ${{ inputs.test-type }}" >> $GITHUB_STEP_SUMMARY
        echo "- **作業ディレクトリ**: ${{ inputs.working-directory }}" >> $GITHUB_STEP_SUMMARY
        echo "- **収集時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "- **アーティファクト名**: test-failure-${{ inputs.test-type }}-${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 収集内容" >> $GITHUB_STEP_SUMMARY
        
        case "${{ inputs.test-type }}" in
          "unit")
            echo "- ✅ カバレッジレポート" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ テスト結果XML" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ 依存関係情報" >> $GITHUB_STEP_SUMMARY
            ;;
          "e2e")
            echo "- ✅ Playwrightスクリーンショット" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ テスト実行ビデオ" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ ブラウザログ" >> $GITHUB_STEP_SUMMARY
            ;;
          "integration")
            echo "- ✅ API応答ログ" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ 統合テスト結果" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ 環境設定情報" >> $GITHUB_STEP_SUMMARY
            ;;
        esac
        
        echo "- ✅ システム情報" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 環境変数（安全な項目のみ）" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 アーティファクトダウンロード" >> $GITHUB_STEP_SUMMARY
        echo "GitHub Actions の Summary ページからアーティファクトをダウンロードできます。" >> $GITHUB_STEP_SUMMARY
        echo "保存期間: 30日間" >> $GITHUB_STEP_SUMMARY