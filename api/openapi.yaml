# This file defines the v1 API contract for the Excel Unlocker service.
# It is the single source of truth for API endpoints, request/response formats,
# and authentication methods. It is used for generating frontend types,
# creating mock servers, and validating contracts in the CI/CD pipeline.

openapi: 3.0.3
info:
  title: Excel Unlocker API
  description: |-
    API for unlocking password-protected Excel files.
    The typical flow is:
    1. Client requests a presigned URL to upload a file.
    2. Client uploads the file directly to S3 using the presigned URL.
    3. Client calls the unlock endpoint with the file key and passwords.
    4. Client polls the status endpoint to get the result.

    **Note on uploads**: This API does not handle multipart/form-data uploads directly.
    All file uploads must be performed via the provided S3 presigned URLs.
  version: 1.0.0
servers:
  - url: http://localhost:4010
    description: Local mock server (Prism)
tags:
  - name: v1
    description: API version 1

paths:
  /v1/presigned-urls:
    post:
      tags:
        - v1
      summary: Get a presigned URL for file upload
      operationId: getPresignedUrl
      security:
        - ApiKeyAuth: []
        - GoogleIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  description: The name of the file to be uploaded.
                  example: 'confidential.xlsx'
              required:
                - filename
      responses:
        '200':
          description: Successfully generated presigned URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                success:
                  value:
                    ok: true
                    data:
                      upload_url: "https://s3.us-east-1.amazonaws.com/..."
                      s3_key: "uploads/1234-5678/confidential.xlsx"
                    error: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /v1/unlock:
    post:
      tags:
        - v1
      summary: Start the Excel unlock process
      operationId: unlockFile
      security:
        - ApiKeyAuth: []
        - GoogleIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                s3_key:
                  type: string
                  description: The S3 key of the uploaded file.
                  example: 'uploads/1234-5678/confidential.xlsx'
                passwords:
                  type: array
                  items:
                    type: string
                  description: A list of passwords to try.
                  example: ['pass1', 'pass2']
              required:
                - s3_key
                - passwords
      responses:
        '202':
          description: Unlock process accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                accepted:
                  value:
                    ok: true
                    data:
                      job_id: "job-9876-5432"
                    error: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /v1/status/{job_id}:
    get:
      tags:
        - v1
      summary: Get the status of an unlock job
      operationId: getUnlockStatus
      security:
        - ApiKeyAuth: []
        - GoogleIdToken: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the job to check.
          example: "job-9876-5432"
      responses:
        '200':
          description: Job status retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                success:
                  value:
                    ok: true
                    data:
                      status: "completed"
                      download_url: "https://s3.us-east-1.amazonaws.com/..."
                    error: null
                pending:
                  value:
                    ok: true
                    data:
                      status: "pending"
                    error: null
                failed:
                  value:
                    ok: true
                    data:
                      status: "failed"
                      message: "All passwords failed."
                    error: null
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'


components:
  schemas:
    BaseResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Indicates if the request was successful.
        data:
          type: object
          nullable: true
          description: The response data if the request was successful.
        error:
          type: object
          nullable: true
          properties:
            code:
              type: string
              description: An error code.
            message:
              type: string
              description: A human-readable error message.
            retryable:
              type: boolean
              description: Indicates if the operation can be retried.
      required:
        - ok
        - data
        - error
      additionalProperties: false

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for authentication.
    GoogleIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google ID Token for authentication.
