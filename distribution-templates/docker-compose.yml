version: "3.9"

services:
  excel-unlocker:
    image: excel-unlocker:latest
    container_name: excel-unlocker
    ports:
      - "3000:3000"
    environment:
      # 必要に応じて設定値を上書きしてください
      # - PORT=3000
      # - HOST=0.0.0.0
      # - MAX_FILE_SIZE_MB=50
      # - ALLOWED_EXTENSIONS=.xlsx,.xls
      # - MAX_WORKERS=4
      # - CLIENT_CONCURRENCY=3
      # - DOWNLOAD_EXPIRY_SECONDS=300
    restart: unless-stopped
