<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード解除 - Excel</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Excel パスワード解除ツール</h1>
            <p class="subtitle">パスワード保護された Excel ファイルを解除します</p>
        </header>

        <main class="main-content">
            <!-- ファイル選択エリア（ドラッグ＆ドロップ対応） -->
            <section class="upload-section">
                <div id="drop-zone" class="drop-zone">
                    <div class="drop-zone-content">
                        <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <p class="drop-zone-text">ファイルをドラッグ＆ドロップ</p>
                        <p class="drop-zone-subtext">または</p>
                        <label for="file-input" class="file-select-btn">ファイルを選択</label>
                        <input type="file" id="file-input" accept=".xlsx,.xls" multiple hidden>
                        <p class="file-hint">対応形式: {{ allowed_extensions }} / 最大サイズ: {{ max_file_size_mb }}MB</p>
                    </div>
                </div>
            </section>

            <!-- 処理結果エリア（ドロップゾーンの直下に配置してUX向上） -->
            <section id="results-section" class="results-section hidden">
                <div class="results-header-container">
                    <h2 class="section-title">処理結果</h2>
                    <!-- 一括ダウンロードボタン配置予定地 -->
                </div>
                <ul id="results-list" class="results-list"></ul>
                <button type="button" id="clear-results-btn" class="clear-btn">処理結果をクリア</button>
            </section>

            <!-- 解除対象ファイル一覧 -->
            <section id="file-list-section" class="file-list-section hidden">
                <h2 class="section-title">解除対象ファイル</h2>
                <ul id="file-list" class="file-list"></ul>
                <button type="button" id="clear-files-btn" class="clear-btn">ファイルをクリア</button>
            </section>

            <!-- パスワード入力フォーム -->
            <section class="password-section">
                <h2 class="section-title">パスワード入力</h2>
                <form id="unlock-form" class="password-form">
                    <div class="form-group">
                        <label for="password1" class="form-label">
                            第1パスワード <span class="required">*必須</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="password1" 
                                name="password1" 
                                class="form-input" 
                                placeholder="パスワードを入力"
                                required
                                autocomplete="off"
                            >
                            <button type="button" class="toggle-password" data-target="password1" aria-label="パスワードを表示">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password2" class="form-label">
                            第2パスワード <span class="optional">任意</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="password2" 
                                name="password2" 
                                class="form-input" 
                                placeholder="別のパスワードを試す場合に入力"
                                autocomplete="off"
                            >
                            <button type="button" class="toggle-password" data-target="password2" aria-label="パスワードを表示">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <p class="password-hint">第1パスワードで解除できない場合、第2パスワードで再試行します</p>
                    
                    <button type="submit" id="unlock-btn" class="unlock-btn" disabled>
                        <span class="btn-text">解除を実行</span>
                        <span class="btn-loading hidden">
                            <svg class="spinner" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4"/>
                            </svg>
                            処理中...
                        </span>
                    </button>
                </form>
            </section>
        </main>

        <footer class="footer">
            <p class="footer-text">Tailscale VPN 経由でセキュアにアクセス中</p>
        </footer>
    </div>

    <!-- 設定値をJavaScriptに渡す -->
    <script type="application/json" id="app-config-data">
    {
        "clientConcurrency": {{ client_concurrency }},
        "maxFileSizeMB": {{ max_file_size_mb }},
        "allowedExtensions": "{{ allowed_extensions }}",
        "maxRetryCount": {{ max_retry_count }},
        "downloadExpirySeconds": {{ download_expiry_seconds }}
    }
    </script>
    <script>
        (function() {
            var configData = JSON.parse(document.getElementById('app-config-data').textContent);
            window.APP_CONFIG = {
                clientConcurrency: configData.clientConcurrency,
                maxFileSizeMB: configData.maxFileSizeMB,
                allowedExtensions: configData.allowedExtensions.split(",").map(function(ext) { return ext.trim().toLowerCase(); }),
                maxRetryCount: configData.maxRetryCount,
                downloadExpirySeconds: configData.downloadExpirySeconds
            };
        })();
    </script>
    <script src="/static/js/app.js"></script>
</body>
</html>
